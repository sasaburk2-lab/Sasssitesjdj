<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⛏️ Шахтёрская Империя | Копай вниз, открывай шахты</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0a0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Minecraft', 'Segoe UI', monospace;
            padding: 10px;
            touch-action: pan-x pan-y; /* разрешаем скролл для листания */
        }

        /* контейнер — адаптивный под телефон */
        .game-wrapper {
            background: #1a1f2a;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 3px solid #5a7a4a;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
        }

        /* верхняя панель */
        .top-bar {
            background: #0a0f12e6;
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 2px solid #6a8a4a;
            border-radius: 28px 28px 0 0;
        }

        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #000000aa;
            padding: 6px 14px;
            border-radius: 40px;
            color: #ffdd88;
            display: flex;
            gap: 8px;
            align-items: baseline;
            font-weight: bold;
            font-size: 1rem;
        }

        .stat-card span:first-child {
            color: #aaffaa;
            font-size: 0.7rem;
        }

        .stat-card span:last-child {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffcc44;
        }

        button {
            background: linear-gradient(145deg, #2a2a1a, #1a1a0a);
            border: 2px solid #d4a55a;
            padding: 8px 16px;
            border-radius: 40px;
            font-family: monospace;
            font-weight: bold;
            color: #ffeeaa;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.05s linear;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.96);
        }

        .depth-badge {
            background: #0a0a00cc;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #88ffaa;
        }

        /* Canvas — поле для копания */
        canvas {
            display: block;
            margin: 0;
            background: #2a5a2a;
            cursor: pointer;
            touch-action: none;
            width: 100%;
            height: auto;
        }

        /* Нижняя панель с кнопками листания и магазином */
        .bottom-panel {
            background: #0a0f12e6;
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-top: 2px solid #6a8a4a;
            border-radius: 0 0 28px 28px;
        }

        .scroll-buttons {
            display: flex;
            gap: 20px;
            background: #00000088;
            padding: 6px 16px;
            border-radius: 50px;
        }

        .scroll-btn {
            background: #2a3a2a;
            border: 1px solid #8a7a4a;
            padding: 8px 22px;
            font-size: 1.1rem;
            border-radius: 40px;
            font-weight: bold;
        }

        .shop-btn {
            background: #3a2a1a;
            border-color: #ffaa44;
            padding: 8px 18px;
        }

        @media (max-width: 550px) {
            .stat-card span:last-child { font-size: 1rem; }
            .stat-card { padding: 4px 10px; }
            .scroll-btn { padding: 6px 16px; font-size: 0.9rem; }
            button { padding: 6px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="top-bar">
        <div class="stats">
            <div class="stat-card"><span>🪙 МОНЕТЫ</span> <span id="coinDisplay">0</span></div>
            <div class="stat-card"><span>📏 ГЛУБИНА</span> <span id="depthDisplay">0</span></div>
            <div class="depth-badge" id="biomeBadge">🌿 ЛЕСНАЯ ШАХТА</div>
        </div>
        <button id="resetBtn">🔄 НОВАЯ ИГРА</button>
    </div>
    <canvas id="gameCanvas" width="500" height="500" style="width:100%; aspect-ratio:1/1"></canvas>
    <div class="bottom-panel">
        <div class="scroll-buttons">
            <button class="scroll-btn" id="scrollUpBtn">▲ ВВЕРХ</button>
            <button class="scroll-btn" id="scrollDownBtn">▼ ВНИЗ</button>
        </div>
        <button class="shop-btn" id="shopBtn">🏪 МАГАЗИН / ОТКРЫТЬ ШАХТЫ</button>
    </div>
</div>

<script>
    (function(){
        // --------------------------------------------------------------
        // ПОЛНОЦЕННЫЙ СИМУЛЯТОР ШАХТЁРА ДЛЯ ТЕЛЕФОНА
        // - Копаем блоки пальцем (анимация треска)
        // - Листаем глубину кнопками / свайпом
        // - Открываем новые шахты за монеты (каждая даёт бонус к ценности)
        // - Улучшения: сила кирки, скорость, шанс редкости
        // - Сохранение в localStorage
        // --------------------------------------------------------------
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let size = 500;
        canvas.width = size;
        canvas.height = size;
        
        const BLOCK_SIZE = 50;  // 10x10 блоков видно
        
        // Камера (глубина)
        let cameraDepth = 0;     // смещение по Y (какие блоки видим)
        let playerDepth = 15;     // глубина игрока (старт)
        
        // Бесконечный мир (Map)
        let world = new Map();
        
        // Экономика
        let coins = 100;          // стартовые монеты
        let totalMined = 0;
        
        // Открытые шахты (каждая даёт множитель ценности)
        let unlockedMines = {
            forest: true,   // лесная (стартовая)
            stone: false,   // каменистая
            coal: false,
            gold: false,
            diamond: false,
            netherite: false
        };
        
        // Стоимость открытия шахт
        const minePrices = {
            stone: 500,
            coal: 1500,
            gold: 5000,
            diamond: 20000,
            netherite: 75000
        };
        
        // Множители ценности от шахт
        const mineMultipliers = {
            forest: 1.0,
            stone: 1.3,
            coal: 1.7,
            gold: 2.5,
            diamond: 4.0,
            netherite: 7.0
        };
        
        // Улучшения
        let pickaxePower = 1;     // урон по блоку
        let rareChanceBonus = 0;  // +шанс найти редкую руду
        let coinMultiplier = 1.0;
        
        // Анимация треска
        let crackAnim = { active: false, x: 0, y: 0, stage: 0, particles: [], blockId: null };
        let canMine = true;
        
        // Всплывающие монеты
        let floatingTexts = [];
        
        // ----- ТИПЫ БЛОКОВ (с ценностью) -----
        const BLOCKS = {
            AIR: { id: 0, name: "воздух", color: null, solid: false, baseValue: 0 },
            DIRT: { id: 1, name: "земля", color: "#8B5A2B", dark: "#7B4A1B", solid: true, baseValue: 2 },
            GRASS: { id: 2, name: "трава", color: "#5a9e4a", dark: "#4a8e3a", solid: true, baseValue: 2 },
            STONE: { id: 3, name: "камень", color: "#8a8a8a", dark: "#6a6a6a", solid: true, baseValue: 5 },
            COAL: { id: 4, name: "уголь", color: "#4a4a4a", dark: "#2a2a2a", solid: true, baseValue: 12 },
            IRON: { id: 5, name: "железо", color: "#c8b080", dark: "#a89060", solid: true, baseValue: 25 },
            GOLD: { id: 6, name: "золото", color: "#f4c430", dark: "#d4a420", solid: true, baseValue: 55 },
            DIAMOND: { id: 7, name: "алмаз", color: "#4AE0E8", dark: "#2AC0C8", solid: true, baseValue: 150 },
            EMERALD: { id: 8, name: "изумруд", color: "#3a8a5a", dark: "#1a6a3a", solid: true, baseValue: 130 },
            NETHERITE: { id: 9, name: "незерит", color: "#4a2a3a", dark: "#2a1a2a", solid: true, baseValue: 350 }
        };
        
        // Генерация блока с учётом глубины и открытых шахт
        function generateBlockAt(x, y) {
            let depth = y;
            let r = Math.random() * 100 + rareChanceBonus;
            
            // Незерит (очень глубоко)
            if(depth > 70 && r < 3) return BLOCKS.NETHERITE;
            if(depth > 40 && r < 6) return BLOCKS.DIAMOND;
            if(depth > 35 && r < 9) return BLOCKS.EMERALD;
            if(depth > 25 && r < 18) return BLOCKS.GOLD;
            if(depth > 15 && r < 30) return BLOCKS.IRON;
            if(depth > 8 && r < 50) return BLOCKS.COAL;
            if(depth > 5) return BLOCKS.STONE;
            if(depth <= 2) return BLOCKS.GRASS;
            return BLOCKS.DIRT;
        }
        
        function getBlock(x, y) {
            let key = `${x},${y}`;
            if(world.has(key)) return world.get(key);
            let block = generateBlockAt(x, y);
            world.set(key, block);
            return block;
        }
        
        function setBlock(x, y, block) {
            let key = `${x},${y}`;
            world.set(key, block);
        }
        
        // Получить текущий множитель ценности
        function getCurrentValueMultiplier() {
            let depth = playerDepth;
            let multiplier = 1.0;
            if(unlockedMines.netherite && depth > 60) multiplier = Math.max(multiplier, mineMultipliers.netherite);
            else if(unlockedMines.diamond && depth > 35) multiplier = Math.max(multiplier, mineMultipliers.diamond);
            else if(unlockedMines.gold && depth > 22) multiplier = Math.max(multiplier, mineMultipliers.gold);
            else if(unlockedMines.coal && depth > 10) multiplier = Math.max(multiplier, mineMultipliers.coal);
            else if(unlockedMines.stone && depth > 5) multiplier = Math.max(multiplier, mineMultipliers.stone);
            else multiplier = mineMultipliers.forest;
            return multiplier * coinMultiplier;
        }
        
        // Копание блока
        function mineBlockAt(blockX, blockY) {
            if(!canMine) return false;
            let block = getBlock(blockX, blockY);
            if(block.id === 0) return false;
            
            canMine = false;
            // Запускаем анимацию треска
            crackAnim.active = true;
            crackAnim.x = blockX;
            crackAnim.y = blockY;
            crackAnim.stage = 0;
            crackAnim.blockId = block.id;
            crackAnim.particles = [];
            for(let i=0;i<10;i++) {
                crackAnim.particles.push({
                    x: Math.random() * BLOCK_SIZE,
                    y: Math.random() * BLOCK_SIZE,
                    vx: (Math.random() - 0.5) * 7,
                    vy: (Math.random() - 0.5) * 7 - 2,
                    life: 18
                });
            }
            
            let interval = setInterval(() => {
                if(!crackAnim.active) { clearInterval(interval); return; }
                crackAnim.stage++;
                if(crackAnim.stage >= 4) {
                    clearInterval(interval);
                    let value = Math.floor(block.baseValue * getCurrentValueMultiplier());
                    coins += value;
                    totalMined++;
                    saveGame();
                    setBlock(blockX, blockY, BLOCKS.AIR);
                    showFloatingText(`+${value} 🪙`, blockX, blockY);
                    crackAnim.active = false;
                    canMine = true;
                    updateUI();
                }
            }, 90);
            return true;
        }
        
        function showFloatingText(text, bx, by) {
            floatingTexts.push({ text: text, x: bx, y: by, life: 35 });
        }
        
        // Листание глубины
        function scrollDepth(delta) {
            let newDepth = playerDepth + delta;
            if(newDepth < 0) newDepth = 0;
            if(newDepth > 500) newDepth = 500;
            playerDepth = newDepth;
            cameraDepth = playerDepth - 5;
            if(cameraDepth < 0) cameraDepth = 0;
            updateUI();
        }
        
        // Открытие новой шахты
        function unlockMine(mineId) {
            let price = minePrices[mineId];
            if(coins >= price && !unlockedMines[mineId]) {
                coins -= price;
                unlockedMines[mineId] = true;
                saveGame();
                updateUI();
                showFloatingText(`🏆 ОТКРЫТО: ${mineId.toUpperCase()} ШАХТА!`, 5, playerDepth);
                return true;
            }
            return false;
        }
        
        // Магазин
        function openShop() {
            let msg = "🏪 МАГАЗИН ШАХТЁРА\n\n";
            msg += `💰 Монет: ${Math.floor(coins)}\n`;
            msg += `⛏️ Сила кирки: ${pickaxePower} (+10 монет за улучшение)\n`;
            msg += `🍀 Шанс редкости: +${rareChanceBonus}% (50 монет)\n`;
            if(!unlockedMines.stone) msg += `\n🔹 КАМЕННАЯ ШАХТА - 500 🪙 (множитель x1.3)`;
            if(!unlockedMines.coal) msg += `\n⚫ УГОЛЬНАЯ ШАХТА - 1500 🪙 (x1.7)`;
            if(!unlockedMines.gold) msg += `\n🟡 ЗОЛОТАЯ ШАХТА - 5000 🪙 (x2.5)`;
            if(!unlockedMines.diamond) msg += `\n💎 АЛМАЗНАЯ ШАХТА - 20000 🪙 (x4.0)`;
            if(!unlockedMines.netherite) msg += `\n🔥 НЕЗЕРИТОВАЯ ШАХТА - 75000 🪙 (x7.0)`;
            msg += `\n\nНажмите на кнопку шахты, которую хотите открыть.`;
            let action = prompt(msg + "\n\nВведите название шахты (stone, coal, gold, diamond, netherite) или upgrade_pick, upgrade_luck:");
            if(action === "upgrade_pick" && coins >= 10) { coins -= 10; pickaxePower++; saveGame(); updateUI(); alert("Кирка улучшена!"); }
            else if(action === "upgrade_luck" && coins >= 50) { coins -= 50; rareChanceBonus += 3; saveGame(); updateUI(); alert("Шанс редкости +3%"); }
            else if(action === "stone") unlockMine("stone");
            else if(action === "coal") unlockMine("coal");
            else if(action === "gold") unlockMine("gold");
            else if(action === "diamond") unlockMine("diamond");
            else if(action === "netherite") unlockMine("netherite");
            else alert("Неверная команда или недостаточно монет");
        }
        
        // Сохранение/загрузка
        function saveGame() {
            let save = {
                coins, totalMined, playerDepth, pickaxePower, rareChanceBonus,
                unlockedMines, coinMultiplier
            };
            localStorage.setItem("mineSaver", JSON.stringify(save));
        }
        
        function loadGame() {
            let saved = localStorage.getItem("mineSaver");
            if(saved) {
                let data = JSON.parse(saved);
                coins = data.coins;
                totalMined = data.totalMined;
                playerDepth = data.playerDepth;
                pickaxePower = data.pickaxePower;
                rareChanceBonus = data.rareChanceBonus;
                unlockedMines = data.unlockedMines;
                coinMultiplier = data.coinMultiplier;
                cameraDepth = playerDepth - 5;
                if(cameraDepth < 0) cameraDepth = 0;
            } else {
                coins = 100;
                totalMined = 0;
                playerDepth = 15;
                pickaxePower = 1;
                rareChanceBonus = 0;
                unlockedMines = { forest: true, stone: false, coal: false, gold: false, diamond: false, netherite: false };
                coinMultiplier = 1.0;
                cameraDepth = 10;
            }
            updateUI();
        }
        
        function resetGame() {
            localStorage.removeItem("mineSaver");
            world.clear();
            coins = 100;
            totalMined = 0;
            playerDepth = 15;
            pickaxePower = 1;
            rareChanceBonus = 0;
            unlockedMines = { forest: true, stone: false, coal: false, gold: false, diamond: false, netherite: false };
            coinMultiplier = 1.0;
            cameraDepth = 10;
            updateUI();
            showFloatingText("НОВАЯ ШАХТА!", 5, playerDepth);
        }
        
        function updateUI() {
            document.getElementById('coinDisplay').innerText = Math.floor(coins);
            document.getElementById('depthDisplay').innerText = playerDepth;
            let biome = "🌿 ЛЕСНАЯ";
            if(playerDepth > 60 && unlockedMines.netherite) biome = "🔥 НЕЗЕРИТОВАЯ";
            else if(playerDepth > 35 && unlockedMines.diamond) biome = "💎 АЛМАЗНАЯ";
            else if(playerDepth > 22 && unlockedMines.gold) biome = "🟡 ЗОЛОТАЯ";
            else if(playerDepth > 10 && unlockedMines.coal) biome = "⚫ УГОЛЬНАЯ";
            else if(playerDepth > 5 && unlockedMines.stone) biome = "🪨 КАМЕННАЯ";
            document.getElementById('biomeBadge').innerHTML = biome;
        }
        
        // Отрисовка
        function draw() {
            ctx.clearRect(0, 0, size, size);
            let startX = 0;
            let startY = cameraDepth;
            let endX = startX + 10;
            let endY = startY + 10;
            
            for(let x = startX; x < endX; x++) {
                for(let y = startY; y < endY; y++) {
                    let block = getBlock(x, y);
                    if(block.id !== 0) {
                        let screenX = (x - startX) * BLOCK_SIZE;
                        let screenY = (y - startY) * BLOCK_SIZE;
                        ctx.fillStyle = block.color;
                        ctx.fillRect(screenX, screenY, BLOCK_SIZE-1, BLOCK_SIZE-1);
                        ctx.fillStyle = block.dark;
                        ctx.fillRect(screenX+3, screenY+3, BLOCK_SIZE-7, 5);
                        ctx.strokeStyle = "#2a2a2a";
                        ctx.strokeRect(screenX, screenY, BLOCK_SIZE-1, BLOCK_SIZE-1);
                    }
                }
            }
            
            // Анимация треска
            if(crackAnim.active) {
                let bx = crackAnim.x;
                let by = crackAnim.y;
                let screenX = (bx - 0) * BLOCK_SIZE;
                let screenY = (by - cameraDepth) * BLOCK_SIZE;
                ctx.fillStyle = `rgba(255,200,100,${0.3 + crackAnim.stage*0.15})`;
                ctx.fillRect(screenX, screenY, BLOCK_SIZE, BLOCK_SIZE);
                ctx.fillStyle = "#ffaa44";
                ctx.font = "bold 26px monospace";
                ctx.fillText("💥", screenX+12, screenY+32);
                for(let p of crackAnim.particles) {
                    ctx.fillStyle = `rgba(200,100,50,${p.life/20})`;
                    ctx.fillRect(screenX + p.x, screenY + p.y, 4, 4);
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                }
            }
            
            // Тексты монет
            for(let i=0;i<floatingTexts.length;i++) {
                let t = floatingTexts[i];
                let tx = (t.x - 0) * BLOCK_SIZE + 20;
                let ty = (t.y - cameraDepth) * BLOCK_SIZE - t.life/2;
                ctx.font = "bold 16px monospace";
                ctx.fillStyle = `rgba(255, 220, 0, ${t.life/30})`;
                ctx.fillText(t.text, tx, ty);
                t.life -= 2;
                if(t.life <= 0) floatingTexts.splice(i,1);
            }
            
            // Курсор
            ctx.strokeStyle = "#ffdd88";
            ctx.lineWidth = 3;
            ctx.strokeRect(size/2 - BLOCK_SIZE/2, size/2 - BLOCK_SIZE/2, BLOCK_SIZE, BLOCK_SIZE);
        }
        
        // Обработка клика по блоку
        function handleCanvasTap(e) {
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            let touchX = (e.clientX - rect.left) * scale;
            let touchY = (e.clientY - rect.top) * scale;
            let blockCol = Math.floor(touchX / BLOCK_SIZE);
            let blockRow = Math.floor(touchY / BLOCK_SIZE);
            let targetX = blockCol;
            let targetY = cameraDepth + blockRow;
            mineBlockAt(targetX, targetY);
        }
        
        canvas.addEventListener('click', handleCanvasTap);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleCanvasTap(e.touches[0]); });
        
        document.getElementById('scrollUpBtn').addEventListener('click', () => scrollDepth(-3));
        document.getElementById('scrollDownBtn').addEventListener('click', () => scrollDepth(3));
        document.getElementById('shopBtn').addEventListener('click', () => openShop());
        document.getElementById('resetBtn').addEventListener('click', () => resetGame());
        
        loadGame();
        setInterval(() => saveGame(), 30000);
        
        function animate() {
            draw();
            requestAnimationFrame(animate);
        }
        animate();
    })();
</script>
</body>
</html>
