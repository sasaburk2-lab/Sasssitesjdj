<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Падающие Блоки | Цветная головоломка с физикой и звуком</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0f1a 0%, #070b14 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Orbitron', monospace;
            padding: 20px;
        }

        .game-wrapper {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 20px 25px 28px 25px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.6);
            border: 1px solid rgba(0, 255, 200, 0.35);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 24px;
            box-shadow: 0 0 0 3px rgba(255, 200, 80, 0.4), 0 15px 30px rgba(0,0,0,0.5);
            cursor: pointer;
            background-color: #0a1220;
        }

        .info-panel {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            padding: 10px 25px;
            border-radius: 60px;
            border: 1px solid rgba(0, 210, 200, 0.5);
        }

        .stat {
            background: #0b1422dd;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: #eef5ff;
            font-size: 1rem;
            display: flex;
            gap: 12px;
            align-items: baseline;
            font-family: 'Orbitron', monospace;
        }

        .stat span:first-child {
            color: #6efff0;
            font-size: 0.75rem;
        }

        .stat span:last-child {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffdd99;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .game-btn {
            background: linear-gradient(135deg, #1a2c3c, #0a121f);
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-family: 'Orbitron', monospace;
            font-weight: bold;
            color: #bbffff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #2c7f8a;
        }

        .game-btn:hover {
            transform: scale(1.02);
            background: #2a4a60;
            color: white;
            border-color: gold;
            box-shadow: 0 0 10px cyan;
        }

        .next-block-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #07121ee0;
            padding: 5px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-family: monospace;
        }

        @media (max-width: 650px) {
            .stat span:last-child { font-size: 1.1rem; }
            .stat { padding: 4px 12px; }
            .game-btn { padding: 5px 12px; font-size: 0.7rem; }
            .info-panel { justify-content: center; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="500" height="600" style="width:100%; height:auto; max-width:500px; aspect-ratio:500/600"></canvas>
        <div class="info-panel">
            <div class="stat"><span>ОЧКИ</span> <span id="scoreValue">0</span></div>
            <div class="stat"><span>УРОВЕНЬ</span> <span id="levelValue">1</span></div>
            <div class="stat"><span>ЛИНИИ</span> <span id="linesValue">0</span></div>
            <div class="next-block-preview" id="previewArea">⬇️ СЛЕДУЮЩИЙ</div>
            <div class="action-buttons">
                <button class="game-btn" id="resetBtn">НОВАЯ ИГРА</button>
                <button class="game-btn" id="soundToggleBtn">🔊 ЗВУК ВКЛ</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // --------------------------------------------------------------
        // ИГРА: ПАДАЮЩИЕ БЛОКИ (DRIP BLOCKS)
        // Механика: сверху медленно падает блок (разной формы),
        // игрок нажимает на колонку, блок падает вниз с анимацией,
        // затем застывает. Заполненные линии исчезают. Звуки, прогрессия.
        // --------------------------------------------------------------
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let cols = 8;
        let rows = 12;
        let blockW = canvas.width / cols;   // 62.5
        let blockH = canvas.height / rows;   // 50
        
        let grid = Array(rows).fill().map(() => Array(cols).fill(null));
        
        // Цветовая палитра
        const colorPalette = [
            "#3a86ff", "#2ecc71", "#e74c3c", "#f1c40f", "#e67e22",
            "#9b59b6", "#ff66b2", "#1abc9c", "#e84393", "#3498db",
            "#f39c12", "#2c3e50", "#16a085", "#c0392b"
        ];
        
        // Формы блоков (разные виды)
        const blockShapes = [
            { shape: [[0,0]], w:1, h:1, name:"квадрат" },
            { shape: [[0,0],[0,1]], w:2, h:1, name:"горизонт 2" },
            { shape: [[0,0],[1,0]], w:1, h:2, name:"вертикаль 2" },
            { shape: [[0,0],[0,1],[0,2]], w:3, h:1, name:"линия 3" },
            { shape: [[0,0],[1,0],[2,0]], w:1, h:3, name:"верт 3" },
            { shape: [[0,0],[1,0],[1,1]], w:2, h:2, name:"уголок" },
            { shape: [[0,0],[0,1],[1,0]], w:2, h:2, name:"угол зерк" },
            { shape: [[0,0],[0,1],[1,1]], w:2, h:2, name:"угол инверт" },
            { shape: [[0,0],[0,1],[1,0],[1,1]], w:2, h:2, name:"блок 2x2" }
        ];
        
        // Звуки (Web Audio API)
        let audioCtx = null;
        let soundEnabled = true;
        
        function initAudio() {
            if(audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        function playDropSound() {
            if(!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 220;
                gain.gain.value = 0.15;
                osc.type = "sine";
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) { console.log("audio err"); }
        }
        
        function playLineSound() {
            if(!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 440;
                gain.gain.value = 0.2;
                osc.type = "triangle";
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }
        
        function playGameOverSound() {
            if(!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 150;
                gain.gain.value = 0.25;
                osc.type = "sawtooth";
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.6);
                osc.stop(audioCtx.currentTime + 0.6);
            } catch(e) {}
        }
        
        // Игровые переменные
        let currentBlock = null;      // { shapeData, colorIndex, posX, posY (в сетке), falling, fallProgress, targetRow, startY }
        let nextBlock = null;
        let score = 0;
        let level = 1;
        let linesClearedTotal = 0;
        let gameActive = true;
        let fallAnimation = false;
        let animProgress = 0;    // 0..1
        let animStartY = 0;
        let animTargetY = 0;
        let currentFallingCol = 0;
        
        let requestId = null;
        
        // Генерация случайного блока
        function getRandomBlock() {
            const shapeIdx = Math.floor(Math.random() * blockShapes.length);
            const shapeData = blockShapes[shapeIdx];
            const colorIdx = Math.floor(Math.random() * colorPalette.length);
            return {
                shape: shapeData.shape,
                width: shapeData.w,
                height: shapeData.h,
                colorIndex: colorIdx,
                shapeObj: shapeData
            };
        }
        
        function generateNextBlock() {
            if(!nextBlock) {
                nextBlock = getRandomBlock();
            }
            currentBlock = JSON.parse(JSON.stringify(nextBlock));
            nextBlock = getRandomBlock();
            // начальная позиция: по центру по горизонтали, вертикаль = 0
            let startCol = Math.floor((cols - currentBlock.width) / 2);
            if(startCol < 0) startCol = 0;
            if(startCol + currentBlock.width > cols) startCol = cols - currentBlock.width;
            currentBlock.posX = startCol;
            currentBlock.posY = 0;
            currentBlock.falling = true;
            currentBlock.fallProgress = 0;
            currentBlock.targetRow = null;
            currentBlock.animating = false;
            // проверка на проигрыш сразу
            if(!canPlaceAt(currentBlock, currentBlock.posX, 0)) {
                gameActive = false;
                playGameOverSound();
            }
        }
        
        // Проверка возможности разместить блок в определённой позиции (по колонке X, Y)
        function canPlaceAt(block, offsetX, offsetY) {
            for(let cell of block.shape) {
                let r = offsetY + cell[0];
                let c = offsetX + cell[1];
                if(r >= rows || c < 0 || c >= cols) return false;
                if(r >= 0 && grid[r][c] !== null) return false;
                if(r < 0) continue; // выше поля допустимо
            }
            return true;
        }
        
        // Получить максимальную строку, куда упадёт блок в выбранной колонке (нажатие)
        function getDropRowForColumn(block, targetCol) {
            for(let row = 0; row <= rows; row++) {
                if(!canPlaceAt(block, targetCol, row)) {
                    return row - 1;
                }
            }
            return rows - block.height;
        }
        
        // Начать анимацию падения блока в указанную колонку
        function startFallingToColumn(col) {
            if(!gameActive) return false;
            if(!currentBlock || !currentBlock.falling) return false;
            // проверка, можно ли разместить блок в этой колонке
            let possible = true;
            for(let cell of currentBlock.shape) {
                let c = col + cell[1];
                if(c < 0 || c >= cols) { possible = false; break; }
            }
            if(!possible) return false;
            
            let targetRow = getDropRowForColumn(currentBlock, col);
            if(targetRow < 0) return false;
            
            // анимируем
            currentBlock.animating = true;
            currentBlock.startY = currentBlock.posY;
            currentBlock.targetY = targetRow;
            currentBlock.animProgress = 0;
            currentBlock.fallTargetCol = col;
            currentBlock.posX = col;  // фиксируем колонку
            
            playDropSound();
            return true;
        }
        
        // Завершить падение и зафиксировать блок на сетке
        function commitBlock() {
            if(!currentBlock) return;
            // размещаем блок в сетке
            for(let cell of currentBlock.shape) {
                let r = currentBlock.targetY + cell[0];
                let c = currentBlock.posX + cell[1];
                if(r >= 0 && r < rows && c >=0 && c < cols) {
                    grid[r][c] = currentBlock.colorIndex;
                }
            }
            // проверить и очистить заполненные линии
            let cleared = clearFullLines();
            if(cleared > 0) {
                linesClearedTotal += cleared;
                let points = 100 * cleared * level;
                if(cleared >= 4) points = Math.floor(points * 1.5);
                score += points;
                playLineSound();
                // повышение уровня каждые 8 линий
                let newLevel = 1 + Math.floor(linesClearedTotal / 8);
                if(newLevel > level) {
                    level = newLevel;
                }
                updateUI();
            }
            // создать новый блок
            generateNextBlock();
            updateUI();
            if(!gameActive) {
                playGameOverSound();
            }
        }
        
        // Очистка полных строк и столбцов (как в Block Blast)
        function clearFullLines() {
            let rowsToClear = [];
            for(let r=0; r<rows; r++) {
                let full = true;
                for(let c=0; c<cols; c++) {
                    if(grid[r][c] === null) { full=false; break; }
                }
                if(full) rowsToClear.push(r);
            }
            for(let r of rowsToClear) {
                for(let c=0; c<cols; c++) grid[r][c] = null;
                // сдвиг вниз
                for(let rr=r; rr>0; rr--) {
                    for(let c=0; c<cols; c++) {
                        grid[rr][c] = grid[rr-1][c];
                    }
                }
                for(let c=0; c<cols; c++) grid[0][c] = null;
            }
            return rowsToClear.length;
        }
        
        function updateUI() {
            document.getElementById('scoreValue').innerText = Math.floor(score);
            document.getElementById('levelValue').innerText = level;
            document.getElementById('linesValue').innerText = linesClearedTotal;
            // отрисовать превью следующего блока
            drawPreview();
        }
        
        function drawPreview() {
            const previewDiv = document.getElementById('previewArea');
            if(!nextBlock) return;
            let str = "⬇️ СЛЕД.: ";
            if(nextBlock.shapeObj.name) str += nextBlock.shapeObj.name;
            else str += "блок";
            previewDiv.innerHTML = str;
        }
        
        // отрисовка всей сцены
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // сетка
            for(let i=0; i<=cols; i++) {
                ctx.beginPath();
                ctx.moveTo(i*blockW, 0);
                ctx.lineTo(i*blockW, canvas.height);
                ctx.strokeStyle = "rgba(100,180,240,0.3)";
                ctx.stroke();
            }
            for(let i=0; i<=rows; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i*blockH);
                ctx.lineTo(canvas.width, i*blockH);
                ctx.stroke();
            }
            // статические блоки
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    let val = grid[r][c];
                    if(val !== null) {
                        ctx.fillStyle = colorPalette[val % colorPalette.length];
                        ctx.shadowBlur = 3;
                        ctx.fillRect(c*blockW+1, r*blockH+1, blockW-2, blockH-2);
                        ctx.fillStyle = "rgba(255,245,180,0.25)";
                        ctx.fillRect(c*blockW+3, r*blockH+3, blockW-6, blockH-6);
                    }
                }
            }
            // падающий блок с анимацией
            if(currentBlock && gameActive) {
                let drawY = currentBlock.posY;
                if(currentBlock.animating && currentBlock.animProgress !== undefined) {
                    let t = currentBlock.animProgress;
                    drawY = currentBlock.startY + (currentBlock.targetY - currentBlock.startY) * t;
                } else if(currentBlock.falling && !currentBlock.animating) {
                    drawY = currentBlock.posY;
                }
                for(let cell of currentBlock.shape) {
                    let x = (currentBlock.posX + cell[1]) * blockW;
                    let y = (drawY + cell[0]) * blockH;
                    ctx.fillStyle = colorPalette[currentBlock.colorIndex % colorPalette.length];
                    ctx.fillRect(x+1, y+1, blockW-2, blockH-2);
                    ctx.fillStyle = "rgba(255,240,150,0.5)";
                    ctx.fillRect(x+3, y+3, blockW-6, blockH-6);
                }
            }
            ctx.shadowBlur = 0;
            if(!gameActive) {
                ctx.globalAlpha = 0.7;
                ctx.fillStyle = "#000000";
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.globalAlpha = 1;
                ctx.font = "bold 28px 'Orbitron'";
                ctx.fillStyle = "#ffaa77";
                ctx.fillText("GAME OVER", canvas.width/2-100, canvas.height/2);
                ctx.font = "12px monospace";
                ctx.fillStyle = "cyan";
                ctx.fillText("нажмите НОВАЯ ИГРА", canvas.width/2-85, canvas.height/2+45);
            }
        }
        
        // анимационный цикл
        let lastTimestamp = 0;
        function animate() {
            if(!gameActive) {
                draw();
                requestAnimationFrame(animate);
                return;
            }
            if(currentBlock && currentBlock.animating) {
                let step = 0.12;
                currentBlock.animProgress = (currentBlock.animProgress || 0) + step;
                if(currentBlock.animProgress >= 1.0) {
                    currentBlock.animProgress = 1.0;
                    currentBlock.animating = false;
                    currentBlock.posY = currentBlock.targetY;
                    currentBlock.falling = false;
                    commitBlock();
                }
            } else if(currentBlock && !currentBlock.animating && !currentBlock.falling) {
                // блок только что зафиксирован, ждём следующий
            } else if(currentBlock && currentBlock.falling && !currentBlock.animating) {
                // нет активной анимации падения — блок просто висит, ожидая клика
            }
            draw();
            requestAnimationFrame(animate);
        }
        
        // Обработка клика по полю
        function handleCanvasClick(e) {
            if(!gameActive) return;
            if(!currentBlock || currentBlock.animating) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let mouseX = (e.clientX - rect.left) * scaleX;
            let colIndex = Math.floor(mouseX / blockW);
            if(colIndex >= 0 && colIndex < cols) {
                startFallingToColumn(colIndex);
            }
        }
        
        function resetGame() {
            grid = Array(rows).fill().map(() => Array(cols).fill(null));
            score = 0;
            level = 1;
            linesClearedTotal = 0;
            gameActive = true;
            nextBlock = getRandomBlock();
            generateNextBlock();
            updateUI();
            playDropSound(); // символический старт
        }
        
        // звук тоггл
        let soundBtn = document.getElementById('soundToggleBtn');
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.innerText = soundEnabled ? "🔊 ЗВУК ВКЛ" : "🔇 ЗВУК ВЫКЛ";
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            resetGame();
        });
        canvas.addEventListener('click', handleCanvasClick);
        
        resetGame();
        animate();
        // дополнительная инициализация аудио по первому клику
        canvas.addEventListener('click', () => { initAudio(); }, { once: true });
    })();
</script>
</body>
</html>
