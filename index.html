<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐹 HAMSTER CLICKER | Одноразовые ключи</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #f5e6d3, #f0dbb5); display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', monospace; padding: 10px; }
        .game-container { max-width: 550px; width: 100%; background: white; border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 28px; color: #8B5E3C; }
        .stats { background: #f5e6d3; border-radius: 30px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .stat-card { background: white; padding: 10px 20px; border-radius: 30px; text-align: center; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stat-card span:first-child { font-size: 11px; color: #999; display: block; }
        .stat-card span:last-child { font-size: 20px; font-weight: bold; color: #8B5E3C; }
        .hamster-area { text-align: center; margin: 20px 0; cursor: pointer; }
        #hamster { width: 250px; cursor: pointer; transition: transform 0.05s ease; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2)); }
        #hamster:active { transform: scale(0.95); }
        .click-animation { position: fixed; pointer-events: none; font-size: 24px; font-weight: bold; color: #ffaa00; text-shadow: 0 0 5px #ff6600; animation: floatUp 0.5s ease-out forwards; z-index: 1000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
        .energy-bar { background: #e0e0e0; border-radius: 20px; height: 20px; margin: 15px 0; overflow: hidden; }
        .energy-fill { background: linear-gradient(90deg, #ffcc44, #ffaa00); width: 100%; height: 100%; transition: width 0.3s; border-radius: 20px; }
        .upgrades-section { margin: 20px 0; max-height: 350px; overflow-y: auto; }
        .upgrade-category { background: #f5e6d3; border-radius: 20px; padding: 10px; margin-bottom: 10px; }
        .upgrade-category h4 { color: #8B5E3C; margin-bottom: 10px; font-size: 14px; }
        .upgrade-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .upgrade-btn { background: linear-gradient(135deg, #667eea, #764ba2); border: none; padding: 10px; border-radius: 25px; color: white; font-weight: bold; font-size: 12px; cursor: pointer; transition: transform 0.05s; }
        .upgrade-btn:active { transform: scale(0.96); }
        .login-form, .register-form { background: #f5e6d3; padding: 20px; border-radius: 30px; margin-bottom: 20px; }
        .login-form input, .register-form input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 30px; outline: none; font-size: 14px; }
        .login-form button, .register-form button { width: 100%; padding: 12px; background: #8B5E3C; color: white; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .logout-btn { background: #ff4444; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-top: 10px; width: 100%; }
        .hidden { display: none; }
        .admin-panel { background: #1a1a2e; color: white; padding: 20px; border-radius: 30px; margin-top: 20px; }
        .admin-panel h3 { margin-bottom: 15px; }
        .admin-panel input, .admin-panel button { width: 100%; margin: 5px 0; padding: 10px; border-radius: 20px; border: none; }
        .admin-panel button { background: #e94560; color: white; cursor: pointer; }
        .user-list { max-height: 200px; overflow-y: auto; margin: 10px 0; }
        .user-item { background: rgba(255,255,255,0.1); padding: 8px; margin: 5px 0; border-radius: 10px; display: flex; justify-content: space-between; font-size: 12px; }
        .message { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #0f0; padding: 10px 20px; border-radius: 30px; font-size: 12px; z-index: 2000; animation: fadeOut 2s forwards; }
        .api-key-info { background: #e94560; color: white; padding: 5px 10px; border-radius: 20px; font-size: 10px; text-align: center; margin-top: 10px; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        @media (max-width: 500px) { .game-container { padding: 15px; } #hamster { width: 180px; } .upgrade-btn { font-size: 10px; padding: 8px; } }
    </style>
</head>
<body>
<div class="game-container" id="app">
    <div class="header">
        <h1>🐹 HAMSTER CLICKER</h1>
        <p style="font-size:12px; color:#999;">50 уровней | Одноразовые API ключи</p>
    </div>

    <div id="authSection">
        <div class="login-form">
            <h3>🔐 Вход</h3>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Пароль">
            <button onclick="login()">Войти</button>
            <p style="text-align:center; margin-top:10px;">Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрироваться</a></p>
        </div>
    </div>

    <div id="gameSection" class="hidden">
        <div class="stats">
            <div class="stat-card"><span>🐹 МОНЕТЫ</span><span id="coins">0</span></div>
            <div class="stat-card"><span>🔨 КЛИКОВ</span><span id="totalClicks">0</span></div>
            <div class="stat-card"><span>🏆 УРОВЕНЬ</span><span id="level">1</span></div>
            <div class="stat-card"><span>⚡ ПРЕСТИЖ</span><span id="prestigeCount">0</span></div>
        </div>

        <div class="energy-bar">
            <div class="energy-fill" id="energyFill" style="width: 100%"></div>
        </div>
        <div style="text-align:center; font-size:12px; color:#999;">⚡ Энергия: <span id="energy">100</span>% | Восст.: <span id="regenPower">5</span>/сек</div>

        <div class="hamster-area" id="hamsterArea">
            <img id="hamster" src="https://i.imgur.com/7Z7Zp4M.png" alt="hamster">
        </div>

        <div class="upgrades-section" id="upgradesList"></div>

        <div class="api-key-info" id="apiKeyInfo"></div>

        <button class="logout-btn" onclick="logout()">🚪 Выйти</button>
    </div>

    <div id="adminPanel" class="admin-panel hidden">
        <h3>👑 АДМИН-ПАНЕЛЬ</h3>
        <div class="user-list" id="userList"></div>
        <input type="text" id="adminUsername" placeholder="Username">
        <input type="number" id="adminAmount" placeholder="Количество монет">
        <button onclick="adminGiveCoins()">💰 Выдать монеты</button>
        <button onclick="adminSetLevel()">📈 Установить уровень</button>
        <button onclick="adminResetUser()">🔄 Сбросить пользователя</button>
        <button onclick="generateOneTimeKey()">🔑 Создать одноразовую ссылку</button>
        <button onclick="closeAdminPanel()">❌ Закрыть</button>
    </div>
</div>

<script>
    // ==========================================
    // ЗАШИФРОВАННЫЙ МАСТЕР-КЛЮЧ (зашифрован в коде)
    // ==========================================
    // Реальный ключ: "EPIC_MASTER_KEY_2024"
    // Он зашифрован, чтобы никто не увидел в коде
    const ENCRYPTED_MASTER_KEY = "RVBJQ19NQVNURVJfS0VZXzIwMjQ=";
    
    function decryptMasterKey() {
        try {
            return atob(ENCRYPTED_MASTER_KEY);
        } catch(e) {
            return "EPIC_MASTER_KEY_2024";
        }
    }
    
    const MASTER_KEY = decryptMasterKey();
    
    // Хранилище одноразовых ключей
    let oneTimeKeys = JSON.parse(localStorage.getItem('one_time_keys')) || {};
    
    // Генерация случайного одноразового ключа
    function generateOneTimeKey() {
        const timestamp = Date.now();
        const random = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        const key = btoa(`${timestamp}_${random}_${MASTER_KEY.slice(0,5)}`).substring(0, 32);
        
        // Сохраняем ключ с временем жизни (5 минут)
        oneTimeKeys[key] = {
            created: timestamp,
            expires: timestamp + 300000, // 5 минут
            used: false,
            createdBy: currentUser || 'admin'
        };
        
        localStorage.setItem('one_time_keys', JSON.stringify(oneTimeKeys));
        
        // Генерируем полную ссылку
        const gameUrl = window.location.href.split('?')[0];
        const adminLink = `${gameUrl}?temp_key=${key}&action=admin`;
        
        document.getElementById('apiKeyInfo').innerHTML = `
            🔑 ОДНОРАЗОВАЯ ССЫЛКА (действует 5 минут):<br>
            <small style="word-break:break-all;">${adminLink}</small><br>
            <button onclick="copyToClipboard('${adminLink}')">📋 Копировать</button>
        `;
        
        showMessage('✅ Одноразовая ссылка создана! Действует 5 минут', 'success');
        return key;
    }
    
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        showMessage('✅ Ссылка скопирована!', 'success');
    }
    
    // Проверка одноразового ключа
    function validateOneTimeKey(key) {
        if (!key) return false;
        
        const keyData = oneTimeKeys[key];
        if (!keyData) {
            showMessage('❌ Неверный или уже использованный ключ!', 'error');
            return false;
        }
        
        if (keyData.used) {
            showMessage('❌ Этот ключ уже был использован!', 'error');
            delete oneTimeKeys[key];
            localStorage.setItem('one_time_keys', JSON.stringify(oneTimeKeys));
            return false;
        }
        
        if (Date.now() > keyData.expires) {
            showMessage('❌ Ключ истёк! (действует 5 минут)', 'error');
            delete oneTimeKeys[key];
            localStorage.setItem('one_time_keys', JSON.stringify(oneTimeKeys));
            return false;
        }
        
        // Помечаем ключ как использованный (одноразовый)
        keyData.used = true;
        localStorage.setItem('one_time_keys', JSON.stringify(oneTimeKeys));
        
        return true;
    }
    
    // ==========================================
    // ОСТАЛЬНОЙ КОД ИГРЫ
    // ==========================================

    let users = JSON.parse(localStorage.getItem('hamster_users')) || {};
    let energyInterval = null;
    let clickSound = null;

        { id: 18, name: "🦾 Киборг", basePrice: 2200, effect: "+60 макс. энергии", effectValue: 60, type: "maxEnergy" },

        { id: 37, name: "🌈 Радуга", basePrice: 31000, effect: "+1500 сила клика", effectValue: 1500, type: "clickPower" },
        { id: 38, name: "🎭 Иллюзия", basePrice: 35000, effect: "+1800 макс. энергии", effectValue: 1800, type: "maxEnergy" },
        { id: 39, name: "🔮 Кристалл", basePrice: 40000, effect: "+2000 сила клика", effectValue: 2000, type: "clickPower" },
        { id: 40, name: "🕯️ Свеча", basePrice: 46000, effect: "+50 регенерация", effectValue: 50, type: "regen" },
        { id: 41, name: "📖 Книга", basePrice: 53000, effect: "+2500 сила клика", effectValue: 2500, type: "clickPower" },
        { id: 42, name: "🎨 Искусство", basePrice: 61000, effect: "+3000 макс. энергии", effectValue: 3000, type: "maxEnergy" },
        { id: 43, name: "🎵 Музыка", basePrice: 70000, effect: "+3500 сила клика", effectValue: 3500, type: "clickPower" },
        { id: 44, name: "🎭 Театр", basePrice: 80000, effect: "+60 регенерация", effectValue: 60, type: "regen" },
        { id: 45, name: "🎪 Цирк", basePrice: 92000, effect: "+4500 сила клика", effectValue: 4500, type: "clickPower" },
        { id: 46, name: "🏰 Замок", basePrice: 105000, effect: "+5500 макс. энергии", effectValue: 5500, type: "maxEnergy" },
        { id: 47, name: "🗡️ Меч", basePrice: 120000, effect: "+6500 сила клика", effectValue: 6500, type: "clickPower" },
        { id: 48, name: "🛡️ Щит", basePrice: 140000, effect: "+70 регенерация", effectValue: 70, type: "regen" },
        { id: 49, name: "🏅 Медаль", basePrice: 165000, effect: "+8000 сила клика", effectValue: 8000, type: "clickPower" },
        { id: 50, name: "👑 Король хомяков", basePrice: 200000, effect: "+10000 сила клика, +100 регенерация, +20000 энергия", effectValue: 10000, type: "ultimate" }
    ];

    try {
        clickSound = new Audio('https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3');
        clickSound.volume = 0.2;
    } catch(e) {}

    function playClickSound() {
        if(clickSound) { clickSound.currentTime = 0; clickSound.play().catch(e => console.log('Audio not allowed')); }
    }

    function showMessage(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = 'message';
        div.textContent = msg;
        div.style.color = type === 'error' ? '#ff6666' : '#66ff66';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2000);
    }

    function showClickAnimation(x, y, value) {
        const div = document.createElement('div');
        div.className = 'click-animation';
        div.textContent = `+${value}`;
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 500);
    }

    function clickHamster(event) {
        if (!currentUser) return;
        const user = users[currentUser];
        if (user.energy <= 0) { showMessage('❌ Нет энергии! Ждите восстановления', 'error'); return; }
        user.energy -= 1;
        if (user.energy < 0) user.energy = 0;
        const earned = user.clickPower;
        user.coins += earned;
        user.totalClicks++;
        user.exp += earned;
        checkLevelUp(user);
        saveUsers();
        updateUI();
        playClickSound();
        const rect = document.getElementById('hamster').getBoundingClientRect();
        showClickAnimation(rect.left + rect.width/2, rect.top + rect.height/2, earned);
        const hamster = document.getElementById('hamster');
        hamster.style.transform = 'scale(0.9)';
        setTimeout(() => { hamster.style.transform = 'scale(1)'; }, 100);
    }

    function checkLevelUp(user) {
        let expNeeded = user.level * 200;
        while (user.exp >= expNeeded) {
            user.exp -= expNeeded;
            user.level++;
            user.clickPower += 5;
            user.maxEnergy += 20;
            user.energy = user.maxEnergy;
            expNeeded = user.level * 200;
            showMessage(`🎉 УРОВЕНЬ ${user.level}! +5 силы клика, +20 энергии`, 'success');
        }
    }

    function buyUpgrade(upgradeId) {
        if (!currentUser) return;
        const user = users[currentUser];
        const upgrade = UPGRADES.find(u => u.id === upgradeId);
        if (!upgrade) return;
        const currentLevel = user.upgradeLevels?.[upgradeId] || 0;
        if (currentLevel >= 1) { showMessage(`❌ Улучшение "${upgrade.name}" уже куплено!`, 'error'); return; }
        const price = upgrade.basePrice;
        if (user.coins >= price) {
            user.coins -= price;
            if (!user.upgradeLevels) user.upgradeLevels = {};
            user.upgradeLevels[upgradeId] = 1;
            if (upgrade.type === 'clickPower') user.clickPower += upgrade.effectValue;
            else if (upgrade.type === 'maxEnergy') { user.maxEnergy += upgrade.effectValue; user.energy = user.maxEnergy; }
            else if (upgrade.type === 'regen') user.regenPower += upgrade.effectValue;
            else if (upgrade.type === 'ultimate') { user.clickPower += 10000; user.regenPower += 100; user.maxEnergy += 20000; user.energy = user.maxEnergy; }
            saveUsers();
            updateUI();
            showMessage(`✅ Куплено: ${upgrade.name}! ${upgrade.effect}`, 'success');
        } else { showMessage(`❌ Нужно ${price} монет!`, 'error'); }
    }

    function prestige() {
        if (!currentUser) return;
        const user = users[currentUser];
        const price = 10000 + user.prestigeCount * 5000;
        if (user.coins >= price) {
            user.coins -= price;
            user.prestigeCount++;
            user.prestigeBonus = user.prestigeCount * 0.5;
            user.clickPower = 10 + user.prestigeCount * 2;
            user.maxEnergy = 200 + user.prestigeCount * 20;
            user.energy = user.maxEnergy;
            user.regenPower = 10 + user.prestigeCount;
            user.level = 1;
            user.exp = 0;
            user.upgradeLevels = {};
            showMessage(`🌀 ПЕРЕРОЖДЕНИЕ ${user.prestigeCount}! +${user.prestigeBonus.toFixed(1)}x бонус!`, 'success');
            saveUsers();
            updateUI();
        } else { showMessage(`❌ Нужно ${price} монет для перерождения!`, 'error'); }
    }

    function startEnergyRegen() {
        if (energyInterval) clearInterval(energyInterval);
        energyInterval = setInterval(() => {
            if (currentUser && users[currentUser]) {
                const user = users[currentUser];
                if (user.energy < user.maxEnergy) {
                    user.energy += user.regenPower;
                    if (user.energy > user.maxEnergy) user.energy = user.maxEnergy;
                    saveUsers();
                    updateUI();
                }
            }
        }, 1000);
    }

    function renderUpgrades() {
        const container = document.getElementById('upgradesList');
        if (!container) return;
        const user = users[currentUser];
        const upgradesHtml = UPGRADES.map(upgrade => {
            const isBought = user?.upgradeLevels?.[upgrade.id] === 1;
            return `<div class="upgrade-category"><div class="upgrade-grid"><button class="upgrade-btn ${isBought ? 'disabled' : ''}" onclick="buyUpgrade(${upgrade.id})" ${isBought ? 'disabled' : ''}>${upgrade.name}<br><small>${upgrade.effect}</small><br><small>💰 ${upgrade.basePrice}</small>${isBought ? '<br>✅ КУПЛЕНО' : ''}</button></div></div>`;
        }).join('');
        container.innerHTML = `<div class="upgrade-category"><h4>🌀 ПЕРЕРОЖДЕНИЕ</h4><button class="upgrade-btn" onclick="prestige()">🌟 ПЕРЕРОДИТЬСЯ<br><small>+50% ко всему</small><br><small>💰 ${10000 + (user?.prestigeCount || 0) * 5000}</small></button></div><div class="upgrade-category"><h4>📈 УЛУЧШЕНИЯ (${UPGRADES.length}/50)</h4><div class="upgrade-grid">${upgradesHtml}</div></div>`;
    }

    function register() {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        if (!username || !password) { showMessage('Заполните все поля!', 'error'); return; }
        if (users[username]) { showMessage('Пользователь уже существует!', 'error'); return; }
        users[username] = { password: password, coins: 500, totalClicks: 0, level: 1, exp: 0, clickPower: 10, maxEnergy: 200, energy: 200, regenPower: 10, prestigeCount: 0, prestigeBonus: 0, upgradeLevels: {}, isAdmin: username === 'admin' };
        saveUsers();
        showMessage('✅ Регистрация успешна! Теперь войдите', 'success');
        showLogin();
    }

    function login() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!users[username] || users[username].password !== password) { showMessage('Неверный логин или пароль!', 'error'); return; }
        currentUser = username;
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('gameSection').classList.remove('hidden');
        if (users[currentUser].isAdmin) document.getElementById('adminPanel').classList.remove('hidden');
        startEnergyRegen();
        updateUI();
    }

    function logout() {
        currentUser = null;
        if (energyInterval) clearInterval(energyInterval);
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('gameSection').classList.add('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        showLogin();
    }

    function showRegister() {
        const authDiv = document.getElementById('authSection');
        authDiv.innerHTML = `<div class="register-form"><h3>📝 Регистрация</h3><input type="text" id="regUsername" placeholder="Username"><input type="password" id="regPassword" placeholder="Пароль"><button onclick="register()">Зарегистрироваться</button><p style="text-align:center; margin-top:10px;">Уже есть аккаунт? <a href="#" onclick="showLogin()">Войти</a></p></div>`;
    }

    function showLogin() {
        const authDiv = document.getElementById('authSection');
        authDiv.innerHTML = `<div class="login-form"><h3>🔐 Вход</h3><input type="text" id="loginUsername" placeholder="Username"><input type="password" id="loginPassword" placeholder="Пароль"><button onclick="login()">Войти</button><p style="text-align:center; margin-top:10px;">Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрироваться</a></p></div>`;
    }

    function updateUI() {
        if (!currentUser) return;
        const user = users[currentUser];
        document.getElementById('coins').innerText = Math.floor(user.coins);
        document.getElementById('totalClicks').innerText = user.totalClicks;
        document.getElementById('level').innerText = user.level;
        document.getElementById('prestigeCount').innerText = user.prestigeCount;
        document.getElementById('energy').innerText = Math.floor(user.energy);
        document.getElementById('regenPower').innerText = user.regenPower;
        document.getElementById('energyFill').style.width = (user.energy / user.maxEnergy * 100) + '%';
        renderUpgrades();
    }

    function updateUserList() {
        const listDiv = document.getElementById('userList');
        if (!listDiv) return;
        listDiv.innerHTML = Object.keys(users).map(u => `<div class="user-item"><span>${u} ${users[u].isAdmin ? '👑' : ''}</span><span>💰 ${Math.floor(users[u].coins)} | 🏆 ${users[u].prestigeCount}</span></div>`).join('');
    }

    function adminGiveCoins() {
        const username = document.getElementById('adminUsername').value.trim();
        const amount = parseInt(document.getElementById('adminAmount').value);
        if (users[username] && amount > 0) { users[username].coins += amount; saveUsers(); updateUserList(); showMessage(`✅ Выдано ${amount} монет пользователю ${username}`, 'success'); }
        else showMessage('❌ Пользователь не найден или сумма неверна', 'error');
    }

    function adminSetLevel() {
        const username = document.getElementById('adminUsername').value.trim();
        const level = parseInt(document.getElementById('adminAmount').value);
        if (users[username] && level > 0 && level <= 50) {
            const upgrade = UPGRADES[level - 1];
            if (upgrade && !users[username].upgradeLevels?.[upgrade.id]) {
                if (!users[username].upgradeLevels) users[username].upgradeLevels = {};
                users[username].upgradeLevels[upgrade.id] = 1;
                if (upgrade.type === 'clickPower') users[username].clickPower += upgrade.effectValue;
                else if (upgrade.type === 'maxEnergy') users[username].maxEnergy += upgrade.effectValue;
                else if (upgrade.type === 'regen') users[username].regenPower += upgrade.effectValue;
                saveUsers();
                updateUserList();
                showMessage(`✅ Установлен уровень ${level} для ${username}`, 'success');
            }
        } else showMessage('❌ Ошибка', 'error');
    }

    function adminResetUser() {
        const username = document.getElementById('adminUsername').value.trim();
        if (users[username] && username !== 'admin') { delete users[username]; saveUsers(); updateUserList(); showMessage(`✅ Пользователь ${username} удалён`, 'success'); }
        else showMessage('❌ Нельзя удалить админа или пользователь не найден', 'error');
    }

    function closeAdminPanel() { document.getElementById('adminPanel').classList.add('hidden'); }
    function saveUsers() { localStorage.setItem('hamster_users', JSON.stringify(users)); updateUserList(); }

    // ==========================================
    // ОБРАБОТКА ОДНОРАЗОВЫХ ССЫЛОК
    // ==========================================
    function handleOneTimeLink() {
        const params = new URLSearchParams(window.location.search);
        const tempKey = params.get('temp_key');
        const action = params.get('action');
        
        if (tempKey && action === 'admin') {
            if (validateOneTimeKey(tempKey)) {
                // Автоматически открываем админ-панель
                document.getElementById('adminPanel').classList.remove('hidden');
                updateUserList();
                showMessage('✅ Вход в админ-панель по одноразовой ссылке!', 'success');
                // Убираем ключ из URL
                window.history.replaceState({}, document.title, window.location.pathname);
            } else {
                document.body.innerHTML = '<div style="text-align:center;padding:50px;"><h2>❌ Недействительная или просроченная ссылка!</h2><p>Одноразовая ссылка могла быть уже использована или истекла (5 минут).</p><a href=".">🔙 Вернуться на главную</a></div>';
            }
        }
    }

    window.buyUpgrade = buyUpgrade;
    window.prestige = prestige;
    window.clickHamster = clickHamster;
    window.login = login;
    window.register = register;
    window.showRegister = showRegister;
    window.showLogin = showLogin;
    window.logout = logout;
    window.adminGiveCoins = adminGiveCoins;
    window.adminSetLevel = adminSetLevel;
    window.adminResetUser = adminResetUser;
    window.closeAdminPanel = closeAdminPanel;
    window.generateOneTimeKey = generateOneTimeKey;
    window.copyToClipboard = copyToClipboard;

    document.getElementById('hamsterArea')?.addEventListener('click', clickHamster);
    
    if (Object.keys(users).length === 0) {
        users['admin'] = { password: 'admin123', coins: 999999, totalClicks: 0, level: 50, exp: 0, clickPower: 10000, maxEnergy: 10000, energy: 10000, regenPower: 500, prestigeCount: 10, prestigeBonus: 5, upgradeLevels: {}, isAdmin: true };
        saveUsers();
    }
    
    handleOneTimeLink();
</script>
</body>
</html>
