<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Site - Real Receiver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: white; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; }
        #output { color: #000; font-family: monospace; font-size: 14px; line-height: 1.6; margin-top: 20px; }
        #status { position: fixed; bottom: 10px; right: 10px; font-size: 11px; color: #0f0; background: #000; padding: 4px 8px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="output"></div>
    </div>
    <div id="status">● waiting for commands</div>

    <script>
        // ==========================================
        // НАСТРОЙКИ
        // ==========================================
        var SECRET_KEY = "1";
        var ORIGINAL_HTML = document.body.innerHTML;
        
        // ==========================================
        // ОБНОВЛЕНИЕ СТАТУСА
        // ==========================================
        function updateStatus(text, isError) {
            var statusDiv = document.getElementById('status');
            statusDiv.textContent = text;
            statusDiv.style.color = isError ? '#f00' : '#0f0';
            setTimeout(function() {
                if (!isError) statusDiv.textContent = '● ready';
            }, 2000);
        }
        
        // ==========================================
        // ФУНКЦИЯ СБРОСА
        // ==========================================
        function resetSite() {
            document.getElementById('output').innerHTML = '';
            var line = document.createElement('div');
            line.textContent = 'Site has been reset';
            line.style.color = '#000000';
            document.getElementById('output').appendChild(line);
            updateStatus('● reset complete');
        }
        
        // ==========================================
        // API ДЛЯ СКРИПТОВ
        // ==========================================
        var api = {
            log: function(msg) {
                var line = document.createElement('div');
                line.textContent = msg;
                line.style.color = '#000000';
                document.getElementById('output').appendChild(line);
            },
            clear: function() {
                document.getElementById('output').innerHTML = '';
            },
            html: function(htmlCode) {
                document.getElementById('output').innerHTML = htmlCode;
            },
            reset: function() {
                resetSite();
            },
            style: function(css) {
                var style = document.createElement('style');
                style.textContent = css;
                document.head.appendChild(style);
            },
            title: function(t) {
                document.title = t;
            },
            bg: function(color) {
                document.body.style.backgroundColor = color;
            },
            redirect: function(url) {
                window.location.href = url;
            },
            iframe: function(url) {
                var iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.style.position = 'fixed';
                iframe.style.top = '0';
                iframe.style.left = '0';
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';
                document.body.innerHTML = '';
                document.body.appendChild(iframe);
            },
            alert: function(msg) {
                alert(msg);
            }
        };
        
        // ==========================================
        // ВЫПОЛНЕНИЕ СКРИПТА
        // ==========================================
        function executeScript(scriptCode) {
            try {
                var func = new Function('api', scriptCode);
                func(api);
                updateStatus('● script executed');
                return true;
            } catch(e) {
                updateStatus('● error: ' + e.message, true);
                return false;
            }
        }
        
        // ==========================================
        // ДЕКОДИРОВАНИЕ
        // ==========================================
        function decodeBase64(encoded) {
            try {
                return atob(encoded);
            } catch(e) {
                return null;
            }
        }
        
        // ==========================================
        // ПОЛУЧЕНИЕ ПАРАМЕТРОВ
        // ==========================================
        function getUrlParams() {
            var params = {};
            var queryString = window.location.search.substring(1);
            if (queryString.length === 0) return params;
            
            var pairs = queryString.split('&');
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split('=');
                var key = decodeURIComponent(pair[0]);
                var value = decodeURIComponent(pair[1] || '');
                params[key] = value;
            }
            return params;
        }
        
        // ==========================================
        // ПРОВЕРКА НОВЫХ КОМАНД (КАЖДЫЕ 3 СЕКУНДЫ)
        // ==========================================
        function checkForCommands() {
            fetch(window.location.href)
                .then(function(response) { return response.text(); })
                .catch(function(error) {});
        }
        
        // ==========================================
        // ГЛАВНАЯ ФУНКЦИЯ - ПРИНИМАЕТ ОТПРАВКИ
        // ==========================================
        function init() {
            var params = getUrlParams();
            
            if (!params.key && !params.cmd && !params.action) {
                updateStatus('● ready for commands');
                return;
            }
            
            if (params.key !== SECRET_KEY) {
                document.body.innerHTML = '<h3>Wrong API key</h3><a href=".">Back</a>';
                updateStatus('● wrong key', true);
                return;
            }
            
            if (params.action === 'reset') {
                resetSite();
                document.body.innerHTML = '<h3>Site reset</h3><a href=".">Back to site</a>';
                updateStatus('● reset command received');
                return;
            }
            
            if (params.cmd) {
                var decoded = decodeBase64(params.cmd);
                if (decoded) {
                    executeScript(decoded);
                    document.body.innerHTML = '<h3>Script received and executed</h3><a href=".">Back to site</a>';
                    updateStatus('● script received');
                } else {
                    document.body.innerHTML = '<h3>Decode error</h3><a href=".">Back</a>';
                    updateStatus('● decode error', true);
                }
                return;
            }
        }
        
        // ЗАПУСК
        init();
    </script>
</body>
</html>
