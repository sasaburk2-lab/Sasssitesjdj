<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⛏️ Шахтёрская Империя | Престиж и Админ-Панель</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0a0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Minecraft', 'Segoe UI', monospace;
            padding: 10px;
            touch-action: pan-x pan-y;
        }

        .game-wrapper {
            background: #1a1f2a;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 3px solid #5a7a4a;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
        }

        .top-bar {
            background: #0a0f12e6;
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 2px solid #6a8a4a;
            border-radius: 28px 28px 0 0;
        }

        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #000000aa;
            padding: 6px 14px;
            border-radius: 40px;
            color: #ffdd88;
            display: flex;
            gap: 8px;
            align-items: baseline;
            font-weight: bold;
            font-size: 1rem;
        }

        .stat-card span:first-child { color: #aaffaa; font-size: 0.7rem; }
        .stat-card span:last-child { font-size: 1.4rem; font-weight: 800; color: #ffcc44; }

        button {
            background: linear-gradient(145deg, #2a2a1a, #1a1a0a);
            border: 2px solid #d4a55a;
            padding: 8px 16px;
            border-radius: 40px;
            font-family: monospace;
            font-weight: bold;
            color: #ffeeaa;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.05s linear;
            touch-action: manipulation;
        }
        button:active { transform: scale(0.96); }

        .depth-badge { background: #0a0a00cc; padding: 5px 14px; border-radius: 40px; font-size: 0.7rem; font-weight: bold; color: #88ffaa; }

        canvas {
            display: block;
            margin: 0;
            background: #2a5a2a;
            cursor: pointer;
            touch-action: none;
            width: 100%;
            height: auto;
        }

        .bottom-panel {
            background: #0a0f12e6;
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-top: 2px solid #6a8a4a;
            border-radius: 0 0 28px 28px;
        }

        .scroll-buttons { display: flex; gap: 20px; background: #00000088; padding: 6px 16px; border-radius: 50px; }
        .scroll-btn { background: #2a3a2a; border: 1px solid #8a7a4a; padding: 8px 22px; font-size: 1.1rem; border-radius: 40px; font-weight: bold; }
        .shop-btn { background: #3a2a1a; border-color: #ffaa44; padding: 8px 18px; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1f2a;
            border: 3px solid #d4a55a;
            border-radius: 32px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            color: #ffdd88;
        }
        .modal-content button {
            margin: 8px;
            width: calc(100% - 20px);
        }
        .close {
            float: right;
            font-size: 28px;
            cursor: pointer;
        }

        @media (max-width: 550px) {
            .stat-card span:last-child { font-size: 1rem; }
            .scroll-btn { padding: 6px 16px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="top-bar">
        <div class="stats">
            <div class="stat-card"><span>🪙 МОНЕТЫ</span> <span id="coinDisplay">0</span></div>
            <div class="stat-card"><span>📏 ГЛУБИНА</span> <span id="depthDisplay">0</span></div>
            <div class="stat-card"><span>🏆 УРОВЕНЬ</span> <span id="levelDisplay">1</span></div>
            <div class="depth-badge" id="biomeBadge">🌿 ЛЕСНАЯ ШАХТА</div>
        </div>
        <button id="resetBtn">🔄 НОВАЯ ИГРА</button>
    </div>
    <canvas id="gameCanvas" width="500" height="500" style="width:100%; aspect-ratio:1/1"></canvas>
    <div class="bottom-panel">
        <div class="scroll-buttons">
            <button class="scroll-btn" id="scrollUpBtn">▲ ВВЕРХ</button>
            <button class="scroll-btn" id="scrollDownBtn">▼ ВНИЗ</button>
        </div>
        <button class="shop-btn" id="shopBtn">🏪 МАГАЗИН</button>
    </div>
</div>

<script>
    (function(){
        // ==========================================
        // НАСТРОЙКИ
        // ==========================================
        const SECRET_KEY = "admin_key_123";
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let size = 500;
        canvas.width = size;
        canvas.height = size;
        
        const BLOCK_SIZE = 50;
        let cameraDepth = 0;
        let playerDepth = 15;
        let world = new Map();
        
        let coins = 100;
        let totalMined = 0;
        let prestigeLevel = 1;
        
        let pickaxePower = 1;
        let rareChanceBonus = 0;
        let coinMultiplier = 1.0;
        
        let autoFarmActive = false;
        let autoFarmInterval = null;
        
        // Открытые шахты
        let unlockedMines = {
            forest: true, stone: false, coal: false, gold: false, diamond: false, netherite: false
        };
        
        const minePrices = {
            stone: 500, coal: 1500, gold: 5000, diamond: 20000, netherite: 75000
        };
        
        const mineMultipliers = {
            forest: 1.0, stone: 1.3, coal: 1.7, gold: 2.5, diamond: 4.0, netherite: 7.0
        };
        
        // Цены уровней (престиж)
        const levelPrices = {
            2: 1000, 3: 3000, 4: 8000, 5: 20000, 6: 50000, 7: 100000, 8: 200000, 9: 400000, 10: 800000
        };
        
        // Анимация
        let crackAnim = { active: false, x: 0, y: 0, stage: 0, particles: [] };
        let canMine = true;
        let floatingTexts = [];
        
        // Блоки
        const BLOCKS = {
            AIR: { id: 0, name: "воздух", color: null, solid: false, baseValue: 0 },
            DIRT: { id: 1, name: "земля", color: "#8B5A2B", dark: "#7B4A1B", solid: true, baseValue: 2 },
            GRASS: { id: 2, name: "трава", color: "#5a9e4a", dark: "#4a8e3a", solid: true, baseValue: 2 },
            STONE: { id: 3, name: "камень", color: "#8a8a8a", dark: "#6a6a6a", solid: true, baseValue: 5 },
            COAL: { id: 4, name: "уголь", color: "#4a4a4a", dark: "#2a2a2a", solid: true, baseValue: 12 },
            IRON: { id: 5, name: "железо", color: "#c8b080", dark: "#a89060", solid: true, baseValue: 25 },
            GOLD: { id: 6, name: "золото", color: "#f4c430", dark: "#d4a420", solid: true, baseValue: 55 },
            DIAMOND: { id: 7, name: "алмаз", color: "#4AE0E8", dark: "#2AC0C8", solid: true, baseValue: 150 },
            EMERALD: { id: 8, name: "изумруд", color: "#3a8a5a", dark: "#1a6a3a", solid: true, baseValue: 130 },
            NETHERITE: { id: 9, name: "незерит", color: "#4a2a3a", dark: "#2a1a2a", solid: true, baseValue: 350 }
        };
        
        function generateBlockAt(x, y) {
            let depth = y;
            let r = Math.random() * 100 + rareChanceBonus;
            if(depth > 70 && r < 3) return BLOCKS.NETHERITE;
            if(depth > 40 && r < 6) return BLOCKS.DIAMOND;
            if(depth > 35 && r < 9) return BLOCKS.EMERALD;
            if(depth > 25 && r < 18) return BLOCKS.GOLD;
            if(depth > 15 && r < 30) return BLOCKS.IRON;
            if(depth > 8 && r < 50) return BLOCKS.COAL;
            if(depth > 5) return BLOCKS.STONE;
            if(depth <= 2) return BLOCKS.GRASS;
            return BLOCKS.DIRT;
        }
        
        function getBlock(x, y) {
            let key = `${x},${y}`;
            if(world.has(key)) return world.get(key);
            let block = generateBlockAt(x, y);
            world.set(key, block);
            return block;
        }
        
        function setBlock(x, y, block) {
            world.set(`${x},${y}`, block);
        }
        
        function getCurrentValueMultiplier() {
            let multiplier = 1.0;
            if(unlockedMines.netherite && playerDepth > 60) multiplier = Math.max(multiplier, mineMultipliers.netherite);
            else if(unlockedMines.diamond && playerDepth > 35) multiplier = Math.max(multiplier, mineMultipliers.diamond);
            else if(unlockedMines.gold && playerDepth > 22) multiplier = Math.max(multiplier, mineMultipliers.gold);
            else if(unlockedMines.coal && playerDepth > 10) multiplier = Math.max(multiplier, mineMultipliers.coal);
            else if(unlockedMines.stone && playerDepth > 5) multiplier = Math.max(multiplier, mineMultipliers.stone);
            else multiplier = mineMultipliers.forest;
            return multiplier * coinMultiplier * (1 + prestigeLevel * 0.1);
        }
        
        function mineBlockAt(blockX, blockY) {
            if(!canMine) return false;
            let block = getBlock(blockX, blockY);
            if(block.id === 0) return false;
            
            canMine = false;
            crackAnim.active = true;
            crackAnim.x = blockX;
            crackAnim.y = blockY;
            crackAnim.stage = 0;
            crackAnim.blockId = block.id;
            crackAnim.particles = [];
            for(let i=0;i<10;i++) {
                crackAnim.particles.push({
                    x: Math.random() * BLOCK_SIZE,
                    y: Math.random() * BLOCK_SIZE,
                    vx: (Math.random() - 0.5) * 7,
                    vy: (Math.random() - 0.5) * 7 - 2,
                    life: 18
                });
            }
            
            let interval = setInterval(() => {
                if(!crackAnim.active) { clearInterval(interval); return; }
                crackAnim.stage++;
                if(crackAnim.stage >= 4) {
                    clearInterval(interval);
                    let value = Math.floor(block.baseValue * getCurrentValueMultiplier());
                    coins += value;
                    totalMined++;
                    saveGame();
                    setBlock(blockX, blockY, BLOCKS.AIR);
                    showFloatingText(`+${value} 🪙`, blockX, blockY);
                    crackAnim.active = false;
                    canMine = true;
                    updateUI();
                }
            }, 90);
            return true;
        }
        
        function showFloatingText(text, bx, by) {
            floatingTexts.push({ text: text, x: bx, y: by, life: 35 });
        }
        
        function scrollDepth(delta) {
            let newDepth = playerDepth + delta;
            if(newDepth < 0) newDepth = 0;
            if(newDepth > 500) newDepth = 500;
            playerDepth = newDepth;
            cameraDepth = playerDepth - 5;
            if(cameraDepth < 0) cameraDepth = 0;
            updateUI();
        }
        
        function upgradePrestige() {
            let nextLevel = prestigeLevel + 1;
            let price = levelPrices[nextLevel] || (nextLevel * 50000);
            if(coins >= price) {
                coins -= price;
                prestigeLevel = nextLevel;
                coinMultiplier = 1 + prestigeLevel * 0.1;
                saveGame();
                updateUI();
                showFloatingText(`🏆 УРОВЕНЬ ${prestigeLevel}! Множитель x${coinMultiplier.toFixed(1)}`, 5, playerDepth);
                return true;
            }
            return false;
        }
        
        function unlockMine(mineId) {
            let price = minePrices[mineId];
            if(coins >= price && !unlockedMines[mineId]) {
                coins -= price;
                unlockedMines[mineId] = true;
                saveGame();
                updateUI();
                showFloatingText(`🏆 ОТКРЫТО: ${mineId.toUpperCase()} ШАХТА!`, 5, playerDepth);
                return true;
            }
            return false;
        }
        
        function openShop() {
            let modal = document.getElementById('shopModal');
            if(!modal) {
                modal = document.createElement('div');
                modal.id = 'shopModal';
                modal.className = 'modal';
                document.body.appendChild(modal);
            }
            
            let html = `<div class="modal-content"><span class="close" onclick="document.getElementById('shopModal').style.display='none'">&times;</span>
                <h2>🏪 МАГАЗИН</h2>
                <p>💰 Монет: ${Math.floor(coins)}</p>
                <p>🏆 Уровень: ${prestigeLevel} (множитель x${coinMultiplier.toFixed(1)})</p>
                <hr>
                <h3>🏆 ПОВЫСИТЬ УРОВЕНЬ</h3>
                <button onclick="upgradePrestigeWrapper()">УРОВЕНЬ ${prestigeLevel+1} - ${levelPrices[prestigeLevel+1] || (prestigeLevel+1)*50000} 🪙</button>
                <hr>
                <h3>⛏️ ОТКРЫТЬ ШАХТЫ</h3>`;
            
            if(!unlockedMines.stone) html += `<button onclick="unlockMineWrapper('stone')">🪨 КАМЕННАЯ - ${minePrices.stone} 🪙 (x1.3)</button>`;
            if(!unlockedMines.coal) html += `<button onclick="unlockMineWrapper('coal')">⚫ УГОЛЬНАЯ - ${minePrices.coal} 🪙 (x1.7)</button>`;
            if(!unlockedMines.gold) html += `<button onclick="unlockMineWrapper('gold')">🟡 ЗОЛОТАЯ - ${minePrices.gold} 🪙 (x2.5)</button>`;
            if(!unlockedMines.diamond) html += `<button onclick="unlockMineWrapper('diamond')">💎 АЛМАЗНАЯ - ${minePrices.diamond} 🪙 (x4.0)</button>`;
            if(!unlockedMines.netherite) html += `<button onclick="unlockMineWrapper('netherite')">🔥 НЕЗЕРИТОВАЯ - ${minePrices.netherite} 🪙 (x7.0)</button>`;
            
            html += `</div>`;
            modal.innerHTML = html;
            modal.style.display = 'flex';
        }
        
        window.upgradePrestigeWrapper = () => { upgradePrestige(); openShop(); };
        window.unlockMineWrapper = (mine) => { unlockMine(mine); openShop(); };
        
        function startAutoFarm() {
            if(autoFarmInterval) clearInterval(autoFarmInterval);
            autoFarmActive = true;
            autoFarmInterval = setInterval(() => {
                let centerX = 5;
                let centerY = cameraDepth + 5;
                mineBlockAt(centerX, centerY);
                if(Math.random() < 0.3) scrollDepth(1);
                if(coins >= (levelPrices[prestigeLevel+1] || 999999)) upgradePrestige();
            }, 500);
        }
        
        function stopAutoFarm() {
            if(autoFarmInterval) clearInterval(autoFarmInterval);
            autoFarmActive = false;
            autoFarmInterval = null;
        }
        
        function saveGame() {
            let save = { coins, totalMined, playerDepth, prestigeLevel, pickaxePower, rareChanceBonus, unlockedMines, coinMultiplier };
            localStorage.setItem("mineSaver", JSON.stringify(save));
        }
        
        function loadGame() {
            let saved = localStorage.getItem("mineSaver");
            if(saved) {
                let data = JSON.parse(saved);
                coins = data.coins;
                totalMined = data.totalMined;
                playerDepth = data.playerDepth;
                prestigeLevel = data.prestigeLevel || 1;
                pickaxePower = data.pickaxePower || 1;
                rareChanceBonus = data.rareChanceBonus || 0;
                unlockedMines = data.unlockedMines || { forest: true, stone: false, coal: false, gold: false, diamond: false, netherite: false };
                coinMultiplier = data.coinMultiplier || 1 + prestigeLevel * 0.1;
                cameraDepth = playerDepth - 5;
                if(cameraDepth < 0) cameraDepth = 0;
            } else {
                coins = 100;
                prestigeLevel = 1;
                playerDepth = 15;
                cameraDepth = 10;
                coinMultiplier = 1.1;
            }
            updateUI();
        }
        
        function resetGame() {
            if(confirm("Сбросить игру? Всё пропадёт!")) {
                localStorage.removeItem("mineSaver");
                world.clear();
                coins = 100;
                prestigeLevel = 1;
                playerDepth = 15;
                coinMultiplier = 1.1;
                unlockedMines = { forest: true, stone: false, coal: false, gold: false, diamond: false, netherite: false };
                cameraDepth = 10;
                updateUI();
                showFloatingText("НОВАЯ ШАХТА!", 5, playerDepth);
            }
        }
        
        function updateUI() {
            document.getElementById('coinDisplay').innerText = Math.floor(coins);
            document.getElementById('depthDisplay').innerText = playerDepth;
            document.getElementById('levelDisplay').innerText = prestigeLevel;
            let biome = "🌿 ЛЕСНАЯ";
            if(playerDepth > 60 && unlockedMines.netherite) biome = "🔥 НЕЗЕРИТОВАЯ";
            else if(playerDepth > 35 && unlockedMines.diamond) biome = "💎 АЛМАЗНАЯ";
            else if(playerDepth > 22 && unlockedMines.gold) biome = "🟡 ЗОЛОТАЯ";
            else if(playerDepth > 10 && unlockedMines.coal) biome = "⚫ УГОЛЬНАЯ";
            else if(playerDepth > 5 && unlockedMines.stone) biome = "🪨 КАМЕННАЯ";
            document.getElementById('biomeBadge').innerHTML = biome;
        }
        
        // API обработка
        function handleAPI() {
            const params = new URLSearchParams(window.location.search);
            const key = params.get('key');
            const action = params.get('action');
            const data = params.get('data');
            
            if(key && key === SECRET_KEY) {
                if(action === 'admin') {
                    document.body.innerHTML += `<div style="position:fixed;top:20px;right:20px;background:#000;color:#0f0;padding:20px;z-index:9999;border-radius:10px;">
                        <h2>👑 АДМИН-ПАНЕЛЬ</h2>
                        <button onclick="startAutoFarm()">🤖 ВКЛЮЧИТЬ АВТО-ФЕРМУ</button>
                        <button onclick="stopAutoFarm()">⏹️ ОСТАНОВИТЬ</button>
                        <button onclick="addCoins(10000)">💰 +10000 МОНЕТ</button>
                        <button onclick="upgradePrestige()">🏆 +1 УРОВЕНЬ</button>
                        <button onclick="location.href='.'">❌ ЗАКРЫТЬ</button>
                    </div>`;
                }
                if(action === 'auto_farm') startAutoFarm();
                if(action === 'stop_auto') stopAutoFarm();
                if(action === 'add_coins' && data) {
                    let d = JSON.parse(atob(data));
                    coins += d.amount;
                    saveGame();
                    updateUI();
                }
                if(action === 'set_level' && data) {
                    let d = JSON.parse(atob(data));
                    prestigeLevel = d.level;
                    coinMultiplier = 1 + prestigeLevel * 0.1;
                    saveGame();
                    updateUI();
                }
            }
        }
        
        window.addCoins = (amount) => { coins += amount; saveGame(); updateUI(); };
        window.startAutoFarm = startAutoFarm;
        window.stopAutoFarm = stopAutoFarm;
        
        function draw() {
            ctx.clearRect(0, 0, size, size);
            let startX = 0;
            let startY = cameraDepth;
            for(let x = startX; x < startX + 10; x++) {
                for(let y = startY; y < startY + 10; y++) {
                    let block = getBlock(x, y);
                    if(block.id !== 0) {
                        let screenX = (x - startX) * BLOCK_SIZE;
                        let screenY = (y - startY) * BLOCK_SIZE;
                        ctx.fillStyle = block.color;
                        ctx.fillRect(screenX, screenY, BLOCK_SIZE-1, BLOCK_SIZE-1);
                        ctx.fillStyle = block.dark;
                        ctx.fillRect(screenX+3, screenY+3, BLOCK_SIZE-7, 5);
                        ctx.strokeStyle = "#2a2a2a";
                        ctx.strokeRect(screenX, screenY, BLOCK_SIZE-1, BLOCK_SIZE-1);
                    }
                }
            }
            if(crackAnim.active) {
                let bx = crackAnim.x;
                let by = crackAnim.y;
                let screenX = (bx - 0) * BLOCK_SIZE;
                let screenY = (by - cameraDepth) * BLOCK_SIZE;
                ctx.fillStyle = `rgba(255,200,100,${0.3 + crackAnim.stage*0.15})`;
                ctx.fillRect(screenX, screenY, BLOCK_SIZE, BLOCK_SIZE);
                ctx.fillStyle = "#ffaa44";
                ctx.font = "bold 26px monospace";
                ctx.fillText("💥", screenX+12, screenY+32);
            }
            for(let t of floatingTexts) {
                let tx = (t.x - 0) * BLOCK_SIZE + 20;
                let ty = (t.y - cameraDepth) * BLOCK_SIZE - t.life/2;
                ctx.font = "bold 16px monospace";
                ctx.fillStyle = `rgba(255, 220, 0, ${t.life/30})`;
                ctx.fillText(t.text, tx, ty);
                t.life -= 2;
            }
            floatingTexts = floatingTexts.filter(t => t.life > 0);
            ctx.strokeStyle = "#ffdd88";
            ctx.lineWidth = 3;
            ctx.strokeRect(size/2 - BLOCK_SIZE/2, size/2 - BLOCK_SIZE/2, BLOCK_SIZE, BLOCK_SIZE);
        }
        
        function handleCanvasTap(e) {
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            let touchX = (e.clientX - rect.left) * scale;
            let touchY = (e.clientY - rect.top) * scale;
            let blockCol = Math.floor(touchX / BLOCK_SIZE);
            let blockRow = Math.floor(touchY / BLOCK_SIZE);
            mineBlockAt(blockCol, cameraDepth + blockRow);
        }
        
        canvas.addEventListener('click', handleCanvasTap);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleCanvasTap(e.touches[0]); });
        
        document.getElementById('scrollUpBtn').addEventListener('click', () => scrollDepth(-3));
        document.getElementById('scrollDownBtn').addEventListener('click', () => scrollDepth(3));
        document.getElementById('shopBtn').addEventListener('click', () => openShop());
        document.getElementById('resetBtn').addEventListener('click', () => resetGame());
        
        loadGame();
        setInterval(() => saveGame(), 30000);
        handleAPI();
        
        function animate() { draw(); requestAnimationFrame(animate); }
        animate();
    })();
</script>
</body>
</html>
