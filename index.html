<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Blast — Цветные блоки | стратегическая головоломка</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1a2a 0%, #0a0f1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, monospace;
            padding: 20px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border-radius: 56px;
            padding: 20px 25px 28px 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(100, 200, 255, 0.3);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 24px;
            box-shadow: 0 0 0 3px rgba(255,200,80,0.3), 0 15px 30px rgba(0,0,0,0.4);
            cursor: pointer;
            background-color: #0e1622;
        }

        .info-bar {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            padding: 10px 24px;
            border-radius: 48px;
            border: 1px solid rgba(0, 210, 200, 0.4);
        }

        .stat {
            background: #0a111fd9;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #eef5ff;
            font-size: 1rem;
            display: flex;
            gap: 12px;
            align-items: baseline;
            font-family: 'Orbitron', monospace;
        }

        .stat span:first-child {
            color: #6efff0;
            font-size: 0.8rem;
        }

        .stat span:last-child {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffdd99;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #1e2f3f, #0a121f);
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-family: 'Orbitron', monospace;
            font-weight: bold;
            color: #bbffff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 8px black;
            border: 1px solid #2c7f8a;
        }

        .btn:hover {
            transform: scale(1.02);
            background: #2a4558;
            color: white;
            border-color: gold;
            box-shadow: 0 0 12px cyan;
        }

        .next-label {
            background: #07121ec9;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #aaffdd;
            font-family: monospace;
            letter-spacing: 1px;
        }

        @media (max-width: 700px) {
            .stat span:last-child { font-size: 1.2rem; }
            .stat { padding: 4px 12px; }
            .btn { padding: 5px 14px; font-size: 0.7rem; }
            .info-bar { justify-content: center; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="boardCanvas" width="450" height="450" style="width:100%; height:auto; max-width:450px; aspect-ratio:1/1"></canvas>
        <div class="info-bar">
            <div class="stat"><span>ОЧКИ</span> <span id="scoreDisplay">0</span></div>
            <div class="stat"><span>СЧЁТ</span> <span id="comboDisplay">0</span></div>
            <div class="next-label">СЛЕДУЮЩИЕ БЛОКИ</div>
            <div class="buttons">
                <button class="btn" id="resetBtn">НОВАЯ ИГРА</button>
                <button class="btn" id="helpBtn">ПРАВИЛА</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ------------------------------------------------------------------
        // ИГРА: BLOCK BLAST (БЛОК БАСТЕР)
        // Классическая головоломка: поле 8x8, три предлагаемых блока.
        // Игрок перетаскивает (или кликает) блоки на поле. При заполнении строк/столбцов — очистка и очки.
        // Безграничная игра, долгая прогрессия: сложность растёт через новые формы блоков.
        // ------------------------------------------------------------------
        
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        
        let size = 8;            // поле 8x8
        let cellSize = 450 / size; // 56.25px
        
        let grid = Array(size).fill().map(() => Array(size).fill(null)); // null = пусто, иначе цветовой индекс
        
        // Библиотека цветов блоков (яркие, приятные)
        const colorPalette = [
            "#3a86ff", "#2ecc71", "#e74c3c", "#f1c40f", "#e67e22",
            "#9b59b6", "#ff66b2", "#1abc9c", "#e84393", "#3498db",
            "#f39c12", "#2c3e50", "#16a085", "#c0392b", "#8e44ad"
        ];
        
        // ----- ФОРМЫ БЛОКОВ (БЛОКИ РАЗНЫХ ФОРМ, КАК В BLOCK BLAST) -----
        // Каждая фигура — массив координат [row, col] относительно якоря (0,0)
        const blockShapes = [
            { shape: [[0,0]], name: "моноблок", cells:1 },                      // 1x1
            { shape: [[0,0],[0,1]], name: "горизонталь 2", cells:2 },           // 1x2
            { shape: [[0,0],[1,0]], name: "вертикаль 2", cells:2 },             // 2x1
            { shape: [[0,0],[0,1],[0,2]], name: "линия 3 гор", cells:3 },       // 1x3
            { shape: [[0,0],[1,0],[2,0]], name: "линия 3 верт", cells:3 },      // 3x1
            { shape: [[0,0],[0,1],[1,0]], name: "уголок L", cells:3 },          // L-тримино
            { shape: [[0,0],[1,0],[1,1]], name: "угол зеркальный", cells:3 },
            { shape: [[0,0],[0,1],[1,1]], name: "угол обратный", cells:3 },
            { shape: [[0,0],[1,0],[0,1],[1,1]], name: "квадрат 2x2", cells:4 }, // блок 2x2
            { shape: [[0,0],[0,1],[0,2],[1,1]], name: "Т-образный", cells:4 },
            { shape: [[0,0],[1,0],[2,0],[2,1]], name: "L большой", cells:4 },
            { shape: [[0,0],[0,1],[0,2],[1,0]], name: "змейка", cells:4 },
            { shape: [[0,0],[0,1],[1,1],[1,2]], name: "зигзаг", cells:4 }
        ];
        
        // Игровые параметры
        let currentBlocks = [];   // массив из 3х объектов { shapeIndex, colorIndex, shapeMatrix }
        let score = 0;
        let totalCleared = 0;     // для счёта, сколько линий очищено
        
        let gameOverFlag = false;
        
        // Для выбора блока (активный блок для размещения)
        let selectedBlockIndex = -1;
        let hoverCell = null;      // { row, col }
        
        // Всплывающие уведомления
        let toastMessage = "";
        let toastTimer = 0;
        
        function showMessage(msg, duration = 1800) {
            toastMessage = msg;
            toastTimer = 40;
            setTimeout(() => { if(toastMessage === msg) toastMessage = ""; }, duration);
        }
        
        // Получить случайную форму блока
        function getRandomBlock() {
            const idx = Math.floor(Math.random() * blockShapes.length);
            const shapeData = blockShapes[idx];
            const colorIdx = Math.floor(Math.random() * colorPalette.length);
            // Создаём матрицу формы для упрощённой проверки
            const maxRow = Math.max(...shapeData.shape.map(p => p[0]));
            const maxCol = Math.max(...shapeData.shape.map(p => p[1]));
            let matrix = Array(maxRow+1).fill().map(() => Array(maxCol+1).fill(false));
            for(let p of shapeData.shape) {
                matrix[p[0]][p[1]] = true;
            }
            return {
                shapeIndex: idx,
                colorIndex: colorIdx,
                shapeData: shapeData.shape,
                matrix: matrix,
                width: maxCol+1,
                height: maxRow+1,
                cellsCount: shapeData.cells
            };
        }
        
        // Инициализация новой партии блоков (три штуки)
        function generateNewBlocks() {
            currentBlocks = [];
            for(let i=0; i<3; i++) {
                currentBlocks.push(getRandomBlock());
            }
        }
        
        // Проверка возможности размещения блока на поле
        function canPlaceBlock(block, topRow, leftCol) {
            for(let cell of block.shapeData) {
                const r = topRow + cell[0];
                const c = leftCol + cell[1];
                if(r < 0 || r >= size || c < 0 || c >= size) return false;
                if(grid[r][c] !== null) return false;
            }
            return true;
        }
        
        // Размещение блока на поле
        function placeBlock(blockIndex, row, col) {
            if(gameOverFlag) return false;
            if(selectedBlockIndex === -1) return false;
            const block = currentBlocks[selectedBlockIndex];
            if(!block) return false;
            if(canPlaceBlock(block, row, col)) {
                // размещаем
                for(let cell of block.shapeData) {
                    const r = row + cell[0];
                    const c = col + cell[1];
                    grid[r][c] = block.colorIndex;
                }
                // удаляем использованный блок
                currentBlocks.splice(selectedBlockIndex, 1);
                // добавляем новый блок в конец
                currentBlocks.push(getRandomBlock());
                selectedBlockIndex = -1;
                
                // после размещения проверяем заполненные линии (строки и столбцы)
                let cleared = clearFullLinesAndColumns();
                if(cleared > 0) {
                    totalCleared += cleared;
                    // начисление очков: за каждую линию 25 * (количество линий в группе)
                    let pointsEarned = cleared * 25;
                    if(cleared >= 3) pointsEarned = Math.floor(pointsEarned * 1.5);
                    if(cleared >= 5) pointsEarned = Math.floor(pointsEarned * 2);
                    score += pointsEarned;
                    showMessage(`+${pointsEarned} очков! Очищено ${cleared} линий`);
                }
                
                // проверим, есть ли доступные ходы у игрока
                if(!hasAnyPossibleMove()) {
                    gameOverFlag = true;
                    showMessage("ИГРА ОКОНЧЕНА! Нажмите НОВАЯ ИГРА");
                }
                updateUI();
                return true;
            } else {
                showMessage("Нельзя разместить блок здесь!");
                return false;
            }
        }
        
        // Очистка полностью заполненных строк и столбцов (как в Block Blast)
        function clearFullLinesAndColumns() {
            let rowsToClear = [];
            let colsToClear = [];
            // проверка строк
            for(let r=0; r<size; r++) {
                let full = true;
                for(let c=0; c<size; c++) {
                    if(grid[r][c] === null) { full = false; break; }
                }
                if(full) rowsToClear.push(r);
            }
            // проверка столбцов
            for(let c=0; c<size; c++) {
                let full = true;
                for(let r=0; r<size; r++) {
                    if(grid[r][c] === null) { full = false; break; }
                }
                if(full) colsToClear.push(c);
            }
            // очищаем строки
            for(let r of rowsToClear) {
                for(let c=0; c<size; c++) grid[r][c] = null;
            }
            // очищаем столбцы
            for(let c of colsToClear) {
                for(let r=0; r<size; r++) grid[r][c] = null;
            }
            let totalClearedLines = rowsToClear.length + colsToClear.length;
            if(totalClearedLines > 0) {
                // Дополнительная анимация: просто сообщение
            }
            return totalClearedLines;
        }
        
        // Проверяем, есть ли хотя бы одно место для любого из трёх блоков
        function hasAnyPossibleMove() {
            for(let idx=0; idx<currentBlocks.length; idx++) {
                const block = currentBlocks[idx];
                for(let r=0; r<size; r++) {
                    for(let c=0; c<size; c++) {
                        if(canPlaceBlock(block, r, c)) return true;
                    }
                }
            }
            return false;
        }
        
        // Перезапуск игры
        function resetGame() {
            grid = Array(size).fill().map(() => Array(size).fill(null));
            score = 0;
            totalCleared = 0;
            gameOverFlag = false;
            selectedBlockIndex = -1;
            generateNewBlocks();
            updateUI();
            showMessage("Новая игра! Размещай блоки, заполняй линии.");
        }
        
        function updateUI() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('comboDisplay').innerText = totalCleared;
            draw();
        }
        
        // Отрисовка игрового поля + панель предпросмотра блоков
        function draw() {
            ctx.clearRect(0, 0, 450, 450);
            // сетка
            for(let i=0; i<=size; i++) {
                ctx.beginPath();
                ctx.moveTo(i*cellSize, 0);
                ctx.lineTo(i*cellSize, 450);
                ctx.moveTo(0, i*cellSize);
                ctx.lineTo(450, i*cellSize);
                ctx.strokeStyle = "rgba(80, 160, 220, 0.35)";
                ctx.stroke();
            }
            // блоки на поле
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    const colorIdx = grid[r][c];
                    if(colorIdx !== null) {
                        ctx.fillStyle = colorPalette[colorIdx % colorPalette.length];
                        ctx.shadowBlur = 3;
                        ctx.fillRect(c*cellSize+1, r*cellSize+1, cellSize-2, cellSize-2);
                        ctx.fillStyle = "rgba(255,255,200,0.3)";
                        ctx.fillRect(c*cellSize+3, r*cellSize+3, cellSize-6, cellSize-6);
                    } else if(hoverCell && hoverCell.row === r && hoverCell.col === c && selectedBlockIndex !== -1 && !gameOverFlag) {
                        // подсветка ячейки под курсором
                        ctx.fillStyle = "rgba(255,220,100,0.3)";
                        ctx.fillRect(c*cellSize, r*cellSize, cellSize, cellSize);
                    }
                }
            }
            ctx.shadowBlur = 0;
            
            // Отрисовка трёх следующих блоков (справа или под полем) - нарисуем в правом нижнем углу канваса
            const previewX = 320;
            const previewY = 380;
            ctx.font = "bold 12px monospace";
            ctx.fillStyle = "#cdeeff";
            ctx.fillText("ДОСТУПНЫЕ БЛОКИ:", 295, 30);
            for(let i=0; i<currentBlocks.length; i++) {
                const blk = currentBlocks[i];
                const boxX = 310 + (i%3)*45;
                const boxY = 45 + Math.floor(i/3)*55;
                ctx.fillStyle = "#15222e";
                ctx.fillRect(boxX-3, boxY-3, 42, 42);
                ctx.strokeStyle = "#7fcdff";
                ctx.strokeRect(boxX-3, boxY-3, 42, 42);
                // рисуем миниатюру блока
                const startX = boxX;
                const startY = boxY;
                const miniCell = 12;
                for(let cell of blk.shapeData) {
                    ctx.fillStyle = colorPalette[blk.colorIndex % colorPalette.length];
                    ctx.fillRect(startX + cell[1]*miniCell, startY + cell[0]*miniCell, miniCell-1, miniCell-1);
                }
                if(selectedBlockIndex === i && !gameOverFlag) {
                    ctx.beginPath();
                    ctx.rect(boxX-5, boxY-5, 46, 46);
                    ctx.strokeStyle = "gold";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
            
            // game over overlay
            if(gameOverFlag) {
                ctx.globalAlpha = 0.7;
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, 450, 450);
                ctx.globalAlpha = 1;
                ctx.font = "bold 26px 'Orbitron'";
                ctx.fillStyle = "#ffaa66";
                ctx.shadowBlur = 0;
                ctx.fillText("GAME OVER", 115, 220);
                ctx.font = "14px monospace";
                ctx.fillStyle = "cyan";
                ctx.fillText("нажмите НОВАЯ ИГРА", 150, 280);
            }
            
            // всплывающее сообщение
            if(toastMessage) {
                ctx.font = "bold 14px monospace";
                ctx.fillStyle = "#fff8e7";
                ctx.shadowBlur = 2;
                ctx.fillText(toastMessage, 20, 420);
            }
        }
        
        // Обработка кликов по полю: выбор блока + размещение
        function handleCanvasClick(e) {
            if(gameOverFlag) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let mouseX = (e.clientX - rect.left) * scaleX;
            let mouseY = (e.clientY - rect.top) * scaleY;
            const col = Math.floor(mouseX / cellSize);
            const row = Math.floor(mouseY / cellSize);
            if(row >=0 && row < size && col >=0 && col < size) {
                if(selectedBlockIndex !== -1) {
                    // размещаем выбранный блок
                    const success = placeBlock(selectedBlockIndex, row, col);
                    if(success) {
                        updateUI();
                    }
                    selectedBlockIndex = -1;
                } else {
                    // возможно, клик по миниатюре блока? проверим координаты
                    // зона предпросмотра блоков
                    for(let i=0; i<currentBlocks.length; i++) {
                        const boxX = 310 + (i%3)*45;
                        const boxY = 45 + Math.floor(i/3)*55;
                        if(mouseX >= boxX-3 && mouseX <= boxX+39 && mouseY >= boxY-3 && mouseY <= boxY+39) {
                            selectedBlockIndex = i;
                            updateUI();
                            showMessage(`Выбран блок ${currentBlocks[i].shapeData.length}-клеточный`, 800);
                            break;
                        }
                    }
                }
                draw();
            } else {
                // клик вне поля — сброс выбора
                if(selectedBlockIndex !== -1) {
                    selectedBlockIndex = -1;
                    updateUI();
                }
            }
        }
        
        // движение мыши для подсветки ячейки
        function handleMouseMove(e) {
            if(gameOverFlag) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let mouseX = (e.clientX - rect.left) * scaleX;
            let mouseY = (e.clientY - rect.top) * scaleY;
            const col = Math.floor(mouseX / cellSize);
            const row = Math.floor(mouseY / cellSize);
            if(row >=0 && row < size && col >=0 && col < size) {
                hoverCell = { row, col };
            } else {
                hoverCell = null;
            }
            draw();
        }
        
        function leaveCanvas() {
            hoverCell = null;
            draw();
        }
        
        // привязка событий
        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseleave', leaveCanvas);
        document.getElementById('resetBtn').addEventListener('click', () => { resetGame(); draw(); });
        document.getElementById('helpBtn').addEventListener('click', () => {
            showMessage("ПРАВИЛА: кликни по блоку справа, затем по полю для размещения. Заполни строку или столбец целиком — получи очки!", 4000);
        });
        
        // запуск
        resetGame();
        draw();
    })();
</script>
</body>
</html>
