<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Site - Command Receiver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: white; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 40px; }
        #output { color: #000; font-family: monospace; font-size: 14px; line-height: 1.6; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="output"></div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ
        // ==========================================
        var SECRET_KEY = "1";
        
        // ==========================================
        // ФУНКЦИИ ДЛЯ ВЫВОДА
        // ==========================================
        function showMessage(text, isError) {
            var outputDiv = document.getElementById('output');
            var line = document.createElement('div');
            line.textContent = text;
            if (isError) {
                line.style.color = '#ff0000';
            } else {
                line.style.color = '#000000';
            }
            outputDiv.appendChild(line);
        }
        
        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }
        
        function resetAll() {
            document.getElementById('output').innerHTML = '';
            showMessage('Site has been reset', false);
        }
        
        // ==========================================
        // API ДЛЯ ВЫПОЛНЕНИЯ КОМАНД
        // ==========================================
        var api = {
            log: function(msg) {
                var outputDiv = document.getElementById('output');
                var line = document.createElement('div');
                line.textContent = msg;
                line.style.color = '#000000';
                outputDiv.appendChild(line);
            },
            clear: function() {
                document.getElementById('output').innerHTML = '';
            },
            html: function(htmlCode) {
                document.getElementById('output').innerHTML = htmlCode;
            },
            reset: function() {
                document.getElementById('output').innerHTML = '';
                showMessage('Site reset by command', false);
            }
        };
        
        // ==========================================
        // ВЫПОЛНЕНИЕ JAVASCRIPT КОДА
        // ==========================================
        function executeJavaScript(code) {
            try {
                var func = new Function('api', code);
                func(api);
                return { success: true, error: null };
            } catch(e) {
                return { success: false, error: e.message };
            }
        }
        
        // ==========================================
        // ДЕКОДИРОВАНИЕ BASE64
        // ==========================================
        function decodeBase64(encoded) {
            try {
                var decoded = atob(encoded);
                return decoded;
            } catch(e) {
                return null;
            }
        }
        
        // ==========================================
        // ПОЛУЧЕНИЕ ПАРАМЕТРОВ ИЗ URL
        // ==========================================
        function getUrlParams() {
            var params = {};
            var queryString = window.location.search.substring(1);
            if (queryString.length === 0) return params;
            
            var pairs = queryString.split('&');
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split('=');
                var key = decodeURIComponent(pair[0]);
                var value = decodeURIComponent(pair[1] || '');
                params[key] = value;
            }
            return params;
        }
        
        // ==========================================
        // ПОКАЗ СТРАНИЦЫ С РЕЗУЛЬТАТОМ
        // ==========================================
        function showResultPage(title, message, isError) {
            var container = document.querySelector('.container');
            var color = isError ? '#ff0000' : '#008000';
            container.innerHTML = '<div style="text-align:center;padding:50px;"><h2 style="color:' + color + ';">' + title + '</h2><p>' + message + '</p><br><a href="." style="color:#0066cc;">← Back to site</a></div>';
        }
        
        // ==========================================
        // ГЛАВНАЯ ФУНКЦИЯ - ПРИЁМ КОМАНД
        // ==========================================
        function receiveCommand() {
            var params = getUrlParams();
            
            // Проверка: есть ли вообще параметры
            if (Object.keys(params).length === 0) {
                return;
            }
            
            // Проверка: есть ли ключ
            if (!params.key) {
                showResultPage('ERROR', 'Missing API key', true);
                return;
            }
            
            // Проверка: правильный ли ключ
            if (params.key !== SECRET_KEY) {
                showResultPage('ERROR', 'Invalid API key: ' + params.key, true);
                return;
            }
            
            // Обработка: сброс сайта
            if (params.action === 'reset') {
                resetAll();
                showResultPage('SUCCESS', 'Site has been reset to default', false);
                return;
            }
            
            // Обработка: выполнение команды
            if (params.cmd) {
                var decodedCommand = decodeBase64(params.cmd);
                
                if (decodedCommand === null) {
                    showResultPage('ERROR', 'Failed to decode base64 command', true);
                    return;
                }
                
                var result = executeJavaScript(decodedCommand);
                
                if (result.success) {
                    showResultPage('SUCCESS', 'Command executed successfully', false);
                } else {
                    showResultPage('ERROR', 'Execution error: ' + result.error, true);
                }
                return;
            }
            
            // Если ничего не подошло
            showResultPage('ERROR', 'Unknown command format', true);
        }
        
        // ==========================================
        // ЗАПУСК
        // ==========================================
        receiveCommand();
    </script>
</body>
</html>
